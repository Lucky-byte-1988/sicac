 disponga la ONP. La ONP evalúa el cumplimiento de los requisitos de acceso a la prestación solicitada, en el plazo que se establezca en el reglamento operativo."], "Reg 58.2": ["Reglamento · D.S. N° 189-2025-EF · art. 58.2", "58.2. Los afiliados al SPP presentan sus solicitudes de pensión a través del EAF. La EAF recibida la solicitud debe realizar lo siguiente:<br>a. Valida las UdA efectivas requeridas para acceder a las prestaciones del pilar semicontributivo. Los aportes en cobranza no se contabilizan como UdA.<br>b. Verifica que el afiliado no haya efectuado retiros con posterioridad a la vigencia de la Ley salvo aquellos retiros establecidos en los artículos 40 y 42-A del TUO de la Ley del SPP.<br>c. Valida que el monto de la pensión bajo la modalidad de retiro programado sea inferior al monto de las prestaciones otorgadas en el pilar semicontributivo.<br>d. Para el cálculo de la pensión bajo la modalidad de retiro programado se considera al afiliado y sus beneficios con derecho a pensión de sobrevivencia, y se toma en cuenta la totalidad del saldo CIC, compuesta por los aportes y la rentabilidad generada. Para el cálculo se incluye todos los tipos de aportes, tales como los aportes obligatorios, los aportes voluntarios con fin previsional, aportes destinados a pensión por consumo, otros aportes que puedan ser instaurados en el futuro, así como el Bono de Reconocimiento. En caso de que el Bono de Reconocimiento haya sido emitido, pero aún no haya sido redimido, se considera la proyección de su valor de redención.<br>e. Informa al afiliado el monto estimado de su pensión en el SPP bajo la modalidad de retiro programado, a fin de que este pueda decidir si desea optar por una prestación en el pilar semicontributivo.<br>f. De manifestar su voluntad de acceder a la pensión del pilar semicontributivo, la EAF remite la solicitud a ONP, adjuntando la siguiente documentación: 1. Solicitud de prestación con garantía estatal. 2. Estado de cuenta del saldo CIC actualizado 3. Número de UdA acumuladas durante la permanencia del afiliado en el SPP 4. Monto de pensión proyectada en el SPP bajo la modalidad de retiro programado. 5. Historial de aportes completo durante la permanencia del afiliado en el SPP, donde se consigne el monto el aporte, tipo de aporte, mes de devengue, fecha de pago. 6. De corresponder, información del bono de reconocimiento que se tramitó ante la ONP.<br>g. Una vez recibida la solicitud, la ONP genera el expediente administrativo, evalúa el cumplimiento de los requisitos de acceso a la prestación, dentro del plazo máximo que se establezca en el reglamento operativo.<br>h. En caso, la solicitud es declarada procedente, la ONP informa al afiliado y emite el acto administrativo correspondiente e informa al afiliado. Asimismo, solicita a la EAF el traslado de la totalidad de la CIC, constituido con aportes obligatorios, aportes de pensión por consumo y todo aporte voluntario con fin previsional, y de ser el caso, con recursos provenientes de la redención del Bono de Reconocimiento. No aplican las normas referidas a la pensión provisional de los afiliados al SNP.<br>i. El inicio de la pensión es a partir de la fecha de presentación de la solicitud a que se refiere el literal f, siempre que se cumplan con las condiciones y requisitos para el acceso a la pensión del pilar semicontributivo."], "Reg 60.1": ["Reglamento · D.S. N° 189-2025-EF · art. 60.1", "60.1. La EAF, dentro del plazo máximo que se establezca en el reglamento operativo realiza la transferencia del 100% del saldo acumulado en la CIC al Fondo FCR-SPP. Este saldo incluye tanto los aportes como la rentabilidad generada."], "Reg 71": ["Reglamento · D.S. N° 189-2025-EF · art. 71", "Artículo 71. Aporte voluntario de las personas naturales afiliadas al Sistema que generan rentas de cuarta y/o de quinta categoría del impuesto a la renta y que cuenten con un monto de devolución por pagos en exceso por dichas rentas 71.1. Las personas naturales que perciben rentas de cuarta y/o de quinta categoría a que se refieren los artículos 33 y 34 de la Ley del Impuesto a la Renta pueden comunicar a la SUNAT que el monto de la devolución por pagos en exceso por dichas rentas que soliciten se abone a su CIC como aportes voluntarios con fin previsional.<br>71.2. Para efecto de lo dispuesto en el numeral anterior, se debe tener en cuenta lo siguiente:<br>a. Solo procede el referido aporte voluntario tratándose de la devolución de pagos en exceso por rentas de cuarta y/o quinta categoría que ha sido solicitada por la persona natural que tiene derecho a dicha devolución.<br>b. No procede el mencionado aporte voluntario si es que la persona natural además de las rentas de cuarta y/o de quinta categoría obtiene rentas de fuente extranjera que se suman a estas.<br>c. Al momento de realizar la comunicación la persona natural debe encontrarse afiliada al SPP o SNP y contar con una CIC de aportes voluntarios con fin previsional administrada por una EAF. Lo anterior debe mantenerse hasta que se realice el mencionado aporte voluntario.<br>d. El sujeto que tiene derecho a la devolución no puede optar porque parte del monto materia de devolución le sea devuelto con este medio de devolución y parte con otro medio de devolución.<br>71.3. Si la persona natural comunica que la devolución se debe efectuar de la forma prevista en el presente artículo y se cumple lo señalado en el numeral anterior se está ante un medio específico de devolución, no siendo de aplicación los otros medios de devolución ni la normativa que los regula.<br>71.4. Si con ocasión del procedimiento de devolución se detectan omisiones en tributos o infracciones, la deuda tributaria que se genere por dichos conceptos, puede ser compensada por la SUNAT con el monto a devolver y de quedar un saldo por devolver, la devolución se realiza conforme a lo previsto en el presente artículo.<br>71.5. En caso de que el solicitante tuviera deudas tributarias exigibles a que se refiere el artículo 115 del Código Tributario, la SUNAT puede emitir Notas de Crédito Negociables o cheques no negociables hasta por el monto de aquellas, para que se apliquen contra dichas deudas. El mencionado cheque se gira a la orden de la SUNAT.<br>71.6. La SUNAT autoriza al Banco de la Nación para que transfiera el monto materia de devolución a la EAF en la que la persona natural a quien corresponde la devolución tiene abierta la CIC de aportes voluntarios con fin previsional y que ha sido comunicada a la SUNAT por la referida persona natural. Con dicha transferencia se entiende que el monto materia de la devolución es puesto a disposición de la persona natural.<br>71.7. La EAF es la encargada de que el monto materia de devolución figure en la CIC de aportes voluntarios con fin previsional del afiliado a quien se efectúa la devolución.<br>71.8. La SBS emite las disposiciones de carácter operativo de su competencia que resulten necesarias para implementar lo previsto en el presente artículo."], "Reg 77.1": ["Reglamento · D.S. N° 189-2025-EF · art. 77.1", "77.1. La SUNAT debe proporcionar al MEF por cada ejercicio fiscal la relación de las personas naturales cuyos gastos por consumo se deben considerar para efecto de la pensión por consumo, identificándolas con sus nombres y apellidos y el número de su DNI y señalando por cada una de ellas el monto al que corresponde aplicar el porcentaje establecido en el párrafo 35.7 del artículo 35 de la Ley."], "Reg 78.1": ["Reglamento · D.S. N° 189-2025-EF · art. 78.1", "78.1. E l aporte por consumo equivale al uno por ciento (1%) de la base de cálculo del aporte determinado conforme al artículo 75 del presente reglamento. El pago del Aporte por Consumo se encuentra a cargo de la ONP, la misma que realiza el pago del beneficio a las EAF para que acrediten dicho aporte a los afiliados al Sistema. Dicho pago se realiza con cargo a los recursos previstos en las Leyes anuales de presupuesto y conforme a los procedimientos que se regulen en la normatividad presupuestaria vigente."], "Reg 85.1": ["Reglamento · D.S. N° 189-2025-EF · art. 85.1", "85.1. La administración del pago de las PNC, como parte del Sistema, se encuentra a cargo de la ONP."], "Reg 88": ["Reglamento · D.S. N° 189-2025-EF · art. 88", "Artículo 88. Registro en el AIRHSP La ONP registra los nuevos pensionistas de PNC en el AIRHSP, a partir del primer pago que realice. Asimismo, actualiza de manera continua dicho registro, en concordancia con las relaciones de beneficiarios aprobados mediante las Resoluciones de Dirección Ejecutiva correspondientes."], "Reg 89.1": ["Reglamento · D.S. N° 189-2025-EF · art. 89.1", "89.1. L os Programas Sociales son responsables de la validación e identificación de los terceros autorizados que se haya determinado para el cobro de la PNC."], "Reg 89.2": ["Reglamento · D.S. N° 189-2025-EF · art. 89.2", "89.2. Los Programas Sociales remiten a la ONP un listado preliminar de potenciales beneficiarios y/o terceros autorizados al cobro, previo a la emisión de la Resolución de Dirección Ejecutiva, con el fin de que la ONP realice la apertura de las cuentas bancarias individuales en el Banco de la Nación. El listado de cuentas gestionadas debe ser comunicado por la ONP a los Programas Sociales, a fin de que procedan con la elaboración del padrón o relación de usuarios, según sea el caso."], "Reg 94": ["Reglamento · D.S. N° 189-2025-EF · art. 94", "Artículo 94. Obligación del pago del aporte al FCJTP 94.1. A partir de la entrada en vigor de la Ley, el armador debe efectuar el aporte mensual al FCJTP equivalente al 5% de la remuneración asegurable mensual del trabajador pesquero. 94.2. El armador pesquero, a la vigencia de la obligación del pago del aporte al FCJTP, ya no realiza el aporte dispuesto en el artículo 9 de la Ley N° 30003 respecto de sus trabajadores pesqueros."], "Reg 95.1": ["Reglamento · D.S. N° 189-2025-EF · art. 95.1", "95.1. L a ONP se encarga de la administración del beneficio complementario. En el caso de los pensionistas pesqueros del SPP, las EAF deben remitirle a la ONP, la relación de los beneficiarios del FCJTP con la información necesaria para el cálculo del beneficio complementario."], "Reg 95.2": ["Reglamento · D.S. N° 189-2025-EF · art. 95.2", "95.2. Los recursos del FCJTP son administrados por el FCR, contabilizándose de manera independiente de los demás recursos a su cargo. La administración de los recursos se rige por los lineamientos que ha determinado el Directorio del FCR."], "Reg 96": ["Reglamento · D.S. N° 189-2025-EF · art. 96", "Artículo 96. Declaración y pago del aporte por parte del armador 96.1. El aporte al FCJTP debe ser declarado y pagado por el armador en el plazo establecido en el artículo 29 del Código Tributario para los tributos de determinación mensual y en la forma, condiciones, lugar y cronograma que establezca la SUNAT mediante resolución de superintendencia. 96.2. El aporte al FCJTP se registra mensualmente en la CITPA-FCJTP, conforme a la declaración realizada por los armadores ante la SUNAT. En esa cuenta se registra la información de los aportes mensuales declarados. La SUNAT implementa la CITPA-FCJTP en coordinación con la ONP."], "L32445 DCD": ["Ley N° 32445 · disposición complementaria derogatoria", "DISPOSICIÓN COMPLEMENTARIA DEROGATORIA ÚNICA. Derogación del artículo 9 y de la décimo sétima disposición complementaria final de la Ley 32123, Ley de Modernización del Sistema Previsional Peruano Se derogan el artículo 9 y la décimo sétima disposición complementaria final de la Ley 32123, Ley de Modernización del Sistema Previsional Peruano."], "Ley 2.ª DCF": ["Ley N° 32123 · 2.ª disposición complementaria final", "SEGUNDA. Vigencia La presente ley entra en vigencia al día siguiente de la publicación de su reglamento en el diario oficial El Peruano, conforme con lo dispuesto en la primera disposición complementaria final, salvo los artículos y disposiciones que se indican a continuación:<br>a) El artículo 8 entra en vigor después de dos años de aprobada la presente ley, conforme a lo dispuesto en el 8.2 del mismo.<br>b) La quinta disposición complementaria transitoria entra en vigencia a partir del mes de enero del siguiente año que se apruebe la ley.<br>c) La primera disposición complementaria final, entra en vigencia al día siguiente de la publicación de la presente norma en el diario oficial El Peruano.<br>d) Las responsabilidades asumidas por la ONP según el artículo 13 de la presente ley entra en vigencia al día siguiente de la publicación del decreto supremo que apruebe su transferencia."], "Reg 1.ª DCT": ["Reglamento · D.S. N° 189-2025-EF · 1.ª disposición complementaria transitoria", "PRIMERA. Inicio de aporte por consumo 1.1. El inicio del cómputo de boletas electrónicas para el acceso al aporte por consumo se inicia a partir del 1 de enero de 2027.<br>1.2. La apertura de la cuenta especial por consumo a cargo de las EAF se inicia en diciembre del 2026."], "Reg 2.ª DCT": ["Reglamento · D.S. N° 189-2025-EF · 2.ª disposición complementaria transitoria", "SEGUNDA. Aplicación de las normas sobre elección, afiliación y traslado 2.1 De conformidad con lo dispuesto en el artículo 29 de la Ley, la implementación de los procesos de elección y afiliación determinadas en el presente reglamento no puede exceder del 31 de mayo de 2027. En tanto, transitoriamente continúa aplicándose lo dispuesto en el artículo 16 de la Ley N° 28991, Ley de libre desafiliación informada, pensiones mínimas y complementarias, y régimen especial de jubilación anticipada y las normas del SNP y SPP en materia de elección y afiliación.<br>2.2. El proceso de traslado en el Sistema se implementa a partir de la publicación del reglamento operativo, en concordancia con lo señalado en el artículo 46 del presente reglamento y cuya publicación no puede exceder de los doce (12) meses contados a partir de la entrada en vigor del presente reglamento. En tanto se inicie el traslado en el Sistema, los trabajadores que opten por dejar el SNP pueden incorporarse al SPP conforme a las disposiciones vigentes al momento de la entrada en vigor de la Ley."], "Reg 3.ª DCT": ["Reglamento · D.S. N° 189-2025-EF · 3.ª disposición complementaria transitoria", "TERCERA. Ampliación progresiva de cobertura de la PNC para personas mayores de 65 años en situación de pobreza La PNC para mayores de sesenta y cinco (65) años tiene la progresión en su implementación:<br>a. A partir de la vigencia del reglamento, se mantiene para las personas mayores de sesenta y cinco (65) años en situación de extrema pobreza.<br>b. A partir de 2026, se amplía a mayores de setenta y cinco (75) años en situación de pobreza no extrema afiliados al Sistema.<br>c. Los siguientes grupos son incorporados progresivamente, según la capacidad financiera del Estado y las posibilidades de la economía nacional, con informe previo de ONP."], "Reg 4.ª DCT": ["Reglamento · D.S. N° 189-2025-EF · 4.ª disposición complementaria transitoria", "CUARTA. Registro en el AIRHSP El registro de los perceptores de PNC en el AIRHSP se realiza en el plazo máximo de seis (6) meses de la entrada en vigencia de la Ley y se encuentra a cargo de los respectivos programas sociales, en coordinación con la ONP."], "Reg 5.ª DCT": ["Reglamento · D.S. N° 189-2025-EF · 5.ª disposición complementaria transitoria", "QUINTA. Implementación de la PAST, la FAS y canales de atención virtual La PAST y la FAS se implementa de manera progresiva.<br>a. La ONP en coordinación con la SBS aprueba el plan de implementación de dichos procesos en el plazo máximo de seis (6) meses contados a partir del día siguiente de la publicación del reglamento.<br>b. Mientras dure su implementación, la ONP y las EAF continúan utilizando sus canales propios, y establecen mecanismos de interacción. Esto se aplica también para la afiliación de nuevos afiliados."], "Reg 7.ª DCT": ["Reglamento · D.S. N° 189-2025-EF · 7.ª disposición complementaria transitoria", "SÉPTIMA. Pago de pensiones semicontributivas de afiliados al SPP 7.1 La presentación de solicitudes de pensiones semicontributivas de afiliados al SPP se realiza a partir de la publicación del reglamento operativo indicado en el literal l del artículo 55 del presente reglamento.<br>7.2. La ONP realiza el primer pago de la pensión del pilar semicontributivo a los afiliados del SPP, en un plazo máximo de 30 días calendarios, contados a partir de la transferencia de los recursos de la CIC y conforme al cronograma de pago de pensiones que se aprueba mediante Resolución Viceministerial del sector Economía y Finanzas."], "Reg 9.ª DCT": ["Reglamento · D.S. N° 189-2025-EF · 9.ª disposición complementaria transitoria", "NOVENA. Estimación del gasto del aporte por consumo de los afiliados al sistema a considerar en el presupuesto de los años 2028 y 2029 Para la estimación del gasto del aporte por consumo, a que se refiere el artículo 35 de la Ley, a considerar en la programación del Presupuesto del Sector Público de los años fiscales 2028 y 2029 se debe realizar lo siguiente:<br>a. Información que la SBS debe proporcionar a la SUNAT: 1. La SBS debe proporcionar a la SUNAT, hasta el 15 de febrero de los años 2027 y 2028, la relación de los afiliados al Sistema, al 31 de enero de dichos años, respectivamente, identificándolos con sus nombres, apellidos, su número de DNI, régimen previsional (SNP o SPP) e indicando, de corresponder, la fecha de apertura de la cuenta. Mediante resolución de superintendencia de la SUNAT, previa coordinación con la SBS, se establece la forma y condiciones en que se proporciona la información a que se refiere el presente literal. 2. Para efecto de lo previsto en el inciso anterior, la ONP debe proporcionar a la SBS hasta el quinto día hábil de febrero de los años 2027 y 2028, la relación de las personas que, al 31 de enero de los años 2027 y 2028, respectivamente, se encuentran afiliadas al SNP, debiendo excluir de dicha relación a las personas que hasta dicha fecha han accedido a una prestación previsional, tienen 65 años o más o se encuentran fallecidos.<br>b. Acciones a cargo de la SUNAT 1. Respecto de cada una de las personas incluidas en la relación remitida por la SBS conforme a lo previsto en el literal anterior, la SUNAT debe realizar lo siguiente:<br>i. Determinar la suma de los importes de la venta, cesión en uso y/o del servicio prestado, a que se refiere el inciso 3.8 del numeral 3 del artículo 8 del Reglamento de Comprobantes de Pago que consta en las boletas de venta electrónicas emitidas al afiliado en el año 2026, tratándose de la estimación para el presupuesto del año 2028 y en el año 2027 tratándose de la estimación para el presupuesto del año 2029, la cual no puede exceder de 8 UIT. Para este cálculo se consideran las boletas de venta electrónicas emitidas desde el 1 de enero hasta el 31 de diciembre de cada uno de los mencionados años.<br>ii. Para efecto de lo previsto en el acápite anterior se utiliza la UIT vigente en el ejercicio fiscal en que se emiten las boletas de venta electrónicas, se aplica lo previsto en los literales b), c), d) y los incisos 1 y 2 del literal e) del numeral 75.3 del artículo 75 del presente reglamento y la SUNAT considera únicamente la información que le proporciona la SBS y la que consta en sus sistemas hasta el 31 de enero de los años 2027 y 2028, respectivamente. 2. La SUNAT debe proporcionar al MEF hasta el 31 de marzo del 2027 y 2028, respectivamente la suma determinada de acuerdo con el párrafo anterior del presente reglamento, de manera no individualizada. Mediante Resolución de SUNAT, previa coordinación con el MEF se establece, entre otros, la forma y condiciones en que se proporciona la aludida información.<br>c. Sobre la base de la información a que se refiere el literal anterior, el Viceministerio de Economía realiza la estimación del gasto del aporte por consumo a ser considerado en la programación del Presupuesto del Sector Público de los años fiscales 2028 y 2029, respectivamente. Dicha estimación del gasto se informa hasta el 30 de abril de los años 2027 y 2028, respectivamente, para su consideración en la programación del Presupuesto del Sector Público del año siguiente."], "Reg 18.1": ["Reglamento · D.S. N° 189-2025-EF · art. 18.1", "18.1. Todo ciudadano que se encuentre domiciliado en el país y que cumpla dieciocho (18) años a partir del 1 de junio de 2027 en adelante, se afilia de manera obligatoria al Sistema, eligiendo entre el SNP o SPP, en el marco de lo dispuesto en el presente reglamento."], "Reg 19.1": ["Reglamento · D.S. N° 189-2025-EF · art. 19.1", "19.1. Los ciudadanos que tengan 18 años o más, cumplidos al 31 de mayo de 2027 que se encuentren domiciliados en el país, y que no se encuentren afiliados al Sistema o cualquier otro régimen previsional existente deben afiliarse al Sistema obligatoriamente."], "Reg 19.2": ["Reglamento · D.S. N° 189-2025-EF · art. 19.2", "19.2. Los ciudadanos eligen afiliarse entre el SPP y el SNP, el plazo para la elección de afiliación es hasta doce (12) meses contados a partir del 1 de junio de 2027."], "Reg 72.3": ["Reglamento · D.S. N° 189-2025-EF · art. 72.3", "72.3. El aporte por consumo se financia con cargo a los recursos del Tesoro Público, cuyo monto se consigna y autoriza en las leyes anuales de presupuesto del Sector Público del año siguiente al que se incurre en el gasto por consumo. Para tal efecto, el MEF, a través del Viceministerio de Economía, estima el monto del gasto del aporte por consumo e informa dicho monto hasta el 30 de abril de cada año para su consideración en la programación del Presupuesto del Sector Público del año siguiente."], "Reg 76.2": ["Reglamento · D.S. N° 189-2025-EF · art. 76.2", "76.2. La SBS debe proporcionar la referida información a la SUNAT hasta el 31 de marzo del ejercicio fiscal siguiente a aquél por el cual se calcula el aporte por consumo."], "Reg 77.2": ["Reglamento · D.S. N° 189-2025-EF · art. 77.2", "77.2. La SUNAT considera únicamente la información que le proporciona la SBS y la que conste en sus sistemas hasta el 31 de enero del ejercicio fiscal siguiente a aquél por el que corresponde el cálculo del aporte por consumo. Esta información se debe proporcionar hasta el 31 de julio del ejercicio fiscal siguiente a aquel por el que corresponde el cálculo del referido aporte."], "Reg 78.2": ["Reglamento · D.S. N° 189-2025-EF · art. 78.2", "78.2. Para realizar el cálculo y pago, el MEF traslada a la ONP la información remitida por la SUNAT a la que hace referencia el artículo 77 del presente reglamento, a fin de que la ONP pueda realizar el cálculo individual del beneficio, hasta el 31 de octubre de cada año."], "Reg 78.6": ["Reglamento · D.S. N° 189-2025-EF · art. 78.6", "78.6. La ONP remite los montos pendientes de pago al MEF hasta el 31 de enero de cada año para su consideración en la programación del Presupuesto del Sector Público del año siguiente. Este monto es excluyente al monto al que se refiere el numeral 72.3 del artículo 72 del presente reglamento."], "Reg 106.3": ["Reglamento · D.S. N° 189-2025-EF · art. 106.3", "106.3. La ONP informa al MEF como máximo el 30 de abril de cada año los resultados del cálculo actuarial del año previo, la información debe constar como mínimo de lo siguiente:<br>a. Informe de valuación actuarial de cada uno de regímenes previsionales, identificando los pasivos previsionales. Adicionalmente, se debe consignar información de los activos que respaldan estas obligaciones.<br>b. La nota técnica que incluya los conceptos, supuestos y parámetros empleados para el cálculo actuarial, así como la metodología empleada.<br>c. Los resultados del cálculo actuarial, así como las recomendaciones correspondientes.<br>d. Las bases de datos utilizadas en el cálculo actuarial."], "Reg 83.1": ["Reglamento · D.S. N° 189-2025-EF · art. 83.1", "83.1. El MEF lleva a cabo una evaluación integral de los aportes financiados con recursos del Tesoro Público, del aporte por consumo y del incentivo al ahorro, con una periodicidad de cinco (5) años y tres (3) años, respectivamente. El propósito de esta evaluación es determinar su efectividad, eficiencia y alineamiento con los objetivos para los cuales fueron creados."], "Reg 32.1": ["Reglamento · D.S. N° 189-2025-EF · art. 32.1", "32.1. La EAF administra los aportes voluntarios del afiliado al SNP hasta que este acceda a una prestación en el SNP. En ese momento, la EAF transfiere dichos fondos, al Fondo FCR- Decreto Ley N° 19990, siempre que el afiliado haya optado por utilizar su fondo de aportes voluntarios para complementar UdAs. En el caso del fondo de aportes voluntarios constituidos con recursos del Estado, estos deben ser transferidos obligatoriamente al Fondo FCR – Decreto Ley N° 19990, salvo que el afiliado cuente con aportes obligatorios continuos que le permita generar una UdA por cada mes transcurrido entre su primer aporte obligatorio y su jubilación en el SNP. Las EAF informan anualmente a la ONP, por cada afiliado del SNP, el estado de aportes voluntarios con fin previsional financiados con recursos del Estado, conforme las disposiciones operativas que para ello se disponga."], "ROT 5": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 5", "Artículo 5.- Reglas generales del traslado entre SNP y SPP Las reglas generales de traslado entre el SNP y el SPP son las siguientes:<br>5.1. El afiliado al SIPP, tiene la posibilidad de trasladarse del SNP al SPP, o viceversa, siempre que lo haga de forma voluntaria, informada y transparente, en aceptación de las condiciones y beneficios que ofrece cada régimen previsional.<br>5.2. El afiliado al SIPP puede efectuar su primer traslado entre el SNP y el SPP o viceversa, en cualquier momento, de manera libre, voluntaria e informada, a través de la PAST. Para solicitar un traslado posterior, el afiliado debe haber permanecido en su régimen previsional actual por un periodo mínimo de veinticuatro (24) meses.<br>5.3. En caso el afiliado con un trámite de traslado falleciera antes de la fecha de incorporación en el régimen de destino, mantiene su permanencia en el régimen de origen y corresponde disponer la culminación del trámite. Si una vez producido el traslado, se identifica que el fallecimiento del afiliado fue con anterioridad a la fecha de incorporación, mantendrá su permanencia en el régimen de origen. En caso se haya transferido la CIC al SNP, la ONP gestiona su transferencia al SPP.<br>5.4. El afiliado del SNP que opte por trasladarse al SPP puede solicitar un BdR por los aportes realizados a dicho régimen, siempre que cumpla con los requisitos establecidos en las normas que lo regulan. Alternativamente, el afiliado puede acceder a una pensión garantizada en el SNP, siempre que cumpla el requisito previsto en el numeral 49.4 del artículo 49 del Reglamento.<br>5.5. Los pensionistas de jubilación y de invalidez en el SNP o en el SPP, no pueden trasladarse dentro del SIPP."], "ROT 22": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 22", "Artículo 22.- Comunicación al afiliado del RESIT-SNP 22.1 La EAF comunica al afiliado dicho reporte dentro del plazo máximo de cinco (5) días hábiles contados desde su recepción.<br>22.2. El afiliado manifiesta ante la EAF su conformidad o no conformidad respecto de la información contenida en el RESIT-SNP, dentro del plazo máximo de treinta (30) días hábiles contados desde su comunicación.<br>22.3. En caso el afiliado manifieste su conformidad para continuar con el proceso de traslado, la EAF debe actualizar el estado del trámite en la PAST dentro del plazo máximo de cinco (5) días hábiles de comunicada dicha manifestación, continuando el proceso correspondiente hasta la emisión de la constancia de traslado por parte de la SBS.<br>22.4. En caso el afiliado manifieste su no conformidad, la EAF debe actualizar el estado del trámite en la PAST y poner en conocimiento del afiliado en el plazo máximo de cinco (5) días hábiles de comunicada dicha manifestación, con lo cual no se produce el traslado, y se mantiene en el régimen del SPP, con lo cual se da por finalizado el trámite.<br>22.5. Una vez transcurrido el plazo indicado en el punto 22.2 si el afiliado no comunica su conformidad del RESIT- SNP se da por finalizado el trámite y no se produce el traslado."], "ROT DCT": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · disposición complementaria transitoria", "Única.- Vigencia del Reglamento Operativo e inicio de asesoría, recepción y atención de solicitudes de traslado El presente Reglamento Operativo entra en vigencia al día siguiente de su publicación en el diario oficial El Peruano. Las EAF y la ONP tienen un plazo de adecuación de sus procesos internos el cual no podrá exceder del 31 de mayo del 2027, después del cual, se inicia el proceso de asesoría, recepción y atención de solicitudes."], "ROP 14": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 14", "Artículo 14.- Remisión de la solicitud a la ONP 14.1 La EAF, recibida la solicitud en el plazo máximo de cinco (5) días hábiles, debe revisar que toda la documentación requerida sea presentada por el beneficiario.<br>14.2. Cuando la EAF advierta el incumplimiento de un requisito o documentación, debe seguir lo estipulado en los incisos 8.2 y 8.3 del artículo 8 del presente reglamento operativo.<br>14.3. La EAF remite las solicitudes de los beneficiarios a la ONP, dentro del plazo máximo de tres (3) días hábiles de culminada la evaluación de la solicitud, adjuntando la solicitud debidamente firmada y la documentación anexa correspondiente, a través de los canales que la ONP establezca."], "ROP 16": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 16", "Artículo 16.- Evaluación a cargo de la ONP 16.1 Recibida la solicitud, la ONP genera el expediente administrativo y evalúa el cumplimiento de los requisitos de acceso a la prestación de sobrevivencia del pilar semicontributivo. La tramitación de dicha solicitud se lleva a cabo dentro de los plazos establecidos en el artículo 9 del presente reglamento operativo. Se realiza la notificación tanto al solicitante como a la EAF para que tomen conocimiento dentro del plazo de ley.<br>16.2. El beneficiario tiene la potestad de interponer ante la EAF, el recurso administrativo en contra de la decisión de la ONP, en el plazo de quince (15) días hábiles contados a partir del día siguiente de la notificación del acto administrativo, de conformidad con el Texto Único Ordenado (TUO) de la Ley N° 27444. La EAF recibe y remite la solicitud del recurso administrativo y la documentación correspondiente a la ONP, conforme a los plazos establecidos en el numeral 8.4 del presente reglamento operativo para las solicitudes de prestaciones.<br>16.3. La ONP califica el recurso administrativo dentro de los plazos establecidos en el Texto Único Ordenado (TUO) de la Ley N° 27444 y emite el acto administrativo correspondiente, el mismo que es notificado al beneficiario y a la EAF en el plazo de cinco (5) días hábiles."], "ROP 20": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 20", "Artículo 20.- Validación a cargo de la EAF La EAF, recibida la solicitud en el plazo máximo de cinco (5) días hábiles, debe validar los requisitos y la información presentada por los solicitantes para acceder a la prestación previsional de gastos de sepelio del pensionista fallecido. Del mismo modo, la EAF debe determinar el monto para el pago del beneficio."], "ROP 21": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 21", "Artículo 21.- Remisión de la solicitud a la ONP La EAF remite la solicitud de gastos de sepelio debidamente firmada a la ONP, dentro del plazo máximo de tres (3) días hábiles de culminada la evaluación de la solicitud, a través de los canales que la ONP establezca. Asimismo, con el traslado de la solicitud, se cumple con informar a la ONP sobre el monto que deberá pagar a los solicitantes por concepto de gastos de sepelio."], "ROP 22": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 22", "Artículo 22.- Evaluación a cargo de la ONP 22.1 Recibida la solicitud, la ONP genera el expediente administrativo y evalúa el cumplimiento de los requisitos de acceso al beneficio. La ONP se encarga de efectuar la calificación, para posteriormente emitir la resolución. Se realiza la notificación tanto al solicitante como a la EAF para que tomen conocimiento dentro del plazo de ley.<br>22.2. Toda documentación que no cuente con los requisitos mínimos exigidos para el acceso al beneficio, será devuelta por la ONP a la EAF que corresponda, para su subsanación, conforme a los plazos previstos en los incisos 8.5 y 8.6 del artículo 8 del presente reglamento operativo.<br>22.3. El solicitante tiene la potestad de interponer ante la EAF, el recurso administrativo en contra de la decisión de la ONP, en el plazo de quince (15) días hábiles contados a partir del día siguiente de la notificación del acto administrativo, de conformidad con el Texto Único Ordenado (TUO) de la Ley N° 27444. La EAF recibe y remite la solicitud del recurso administrativo y la documentación correspondiente a la ONP, conforme a los plazos establecidos en el numeral 8.4 del presente reglamento operativo para las solicitudes de prestaciones.<br>22.4. La ONP califica el recurso administrativo dentro de los plazos establecidos en el Texto Único Ordenado (TUO) de la Ley N° 27444 y emite el acto administrativo correspondiente, el mismo que es notificado al beneficiario y a la EAF en el plazo de cinco (5) días hábiles."], "ROP 1.ª DFT": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · 1.ª disposición final y transitoria", "Primera.- Vigencia del reglamento operativo e inicio de asesoría, recepción y atención de solicitudes El presente reglamento operativo entra en vigencia al día siguiente de su publicación en el diario oficial El Peruano. Las EAF y la ONP tienen un plazo de adecuación de sus procesos internos, de hasta cien (100) días hábiles, contados a partir del día siguiente de la fecha de publicación del presente reglamento operativo. Culminado el referido plazo, se inicia el proceso de asesoría, recepción y atención de solicitudes para la atención de prestaciones del pilar semicontributivo en la forma y condiciones establecidas en el presente reglamento operativo. Las EAF deben diseñar una campaña informativa que busque difundir el proceso de acceso al pilar semicontributivo, la cual debe desarrollarse conforme a lo previsto en el presente reglamento operativo, así como aquellas disposiciones que establezca la SBS."]};

": ["Reg 1.ª DCT"], "l": "Diciembre de 2026", "lc": "dic"}, {"f": "2027-01-01", "p": "con", "t": "Empiezan a contar las boletas electrónicas para el aporte por consumo", "arts": ["Reg 1.ª DCT"]}, {"f": "2027-02-05", "p": "psc", "t": "Empieza la atención de solicitudes de pensión semicontributiva del SPP", "arts": ["ROP 1.ª DFT"], "d": "Al vencer los 100 días hábiles de adecuación, contados desde el 14/09/2026.", "est": 1}, {"f": "2027-02-05", "p": "con", "t": "La ONP entrega a la SBS los afiliados al SNP al 31 de enero", "arts": ["Reg 9.ª DCT"], "d": "Quinto día hábil de febrero; excluye a quienes tienen una prestación, 65 años o más o han fallecido."}, {"f": "2027-02-15", "p": "con", "t": "La SBS entrega a la SUNAT la relación de afiliados al Sistema", "arts": ["Reg 9.ª DCT"], "d": "Afiliados al 31 de enero, con su régimen y la fecha de apertura de la cuenta."}, {"f": "2027-03-31", "p": "con", "t": "La SUNAT entrega al MEF la suma de las boletas de 2026", "arts": ["Reg 9.ª DCT"], "d": "De manera no individualizada y con un tope de 8 UIT por afiliado."}, {"f": "2027-04-30", "p": "con", "t": "El MEF estima el gasto del aporte por consumo para el presupuesto 2028", "arts": ["Reg 9.ª DCT"]}, {"f": "2027-05-31", "p": "afi", "t": "Vence el plazo para implementar la elección y la afiliación", "arts": ["Reg 2.ª DCT"]}, {"f": "2027-05-31", "p": "tra", "t": "Vence la adecuación de la ONP y las EAF para los traslados", "arts": ["ROT DCT"]}, {"f": "2027-06-01", "p": "afi", "t": "Empieza la afiliación obligatoria al Sistema", "arts": ["Reg 18.1", "Reg 19.1", "Reg 19.2"], "d": "Quien cumple 18 años elige entre el SNP y el SPP; quien ya los tenía y no está afiliado tiene 12 meses para elegir."}, {"f": "2027-06-01", "p": "tra", "t": "Se reciben las solicitudes de traslado entre el SNP y el SPP", "arts": ["ROT DCT"]}, {"f": "2028-03-31", "p": "con", "t": "La SBS entrega a la SUNAT los afiliados con cuenta por consumo de 2027", "arts": ["Reg 76.2"], "d": "Primer cálculo anual: corre  const lado=`<div class="card mp"><div class="mp-k">Hitos</div><div class="mp-t">${S.pg?PGN[S.pg]:'Ley 32123 y sus normas'}</div><ul class="hl">${li}</ul></div>`;
 return chips+`<div class="grid"><div>${cab}${tablas()}</div><div class="side">${lado}</div></div>`}
function render(){
 $('#vista').innerHTML=[['mapa','Procesos'],['plazos','Plazos e hitos'],['quien','Quién hace qué'],['normas','Normas']].map(([k,t])=>`<button class="${S.v===k?'on':''}" data-v="${k}">${t}</button>`).join('');
 let h='';
 if(S.v==='mapa'){const cnt=g=>MAPA_F.filter(f=>f.g===g).length;
  h=`<div class="chips">${[['','Todo el Sistema'],...MAPA_G].map(([k,t])=>`<button class="chip ${S.g===k?'on':''}" data-g="${k}">${t}<span class="n">${k?cnt(k):MAPA_F.length}</span></button>`).join('')}</div>
   <div class="grid"><div>${mapa()}</div><div class="side">${panel()}</div></div>`}
 else if(S.v==='quien')h=`<div class="grid"><div>${mapa()}</div><div class="side">${quien()}</div></div>`;
 else if(S.v==='plazos')h=plazos();
 else h=normas();
 $('#app').innerHTML=h;wire()}
function paso(d){const L=lista(),i=L.findIndex(f=>f.id===S.cur);const j=i+d;if(j>=0&&j<L.length){S.sel=L[j].id;render()}}
function play(){if(S.T){clearInterval(S.T);S.T=null;render();return}
 const L=lista();let i=L.findIndex(f=>f.id===S.cur);if(i<0||i>=L.length-1)i=-1;
 const tick=()=>{i++;if(i>=L.length){clearInterval(S.T);S.T=null;render();return}S.sel=L[i].id;render()};
 S.T=setInterval(tick,2800);tick()}
function wire(){
 $$('[data-v]').forEach(b=>b.onclick=()=>{if(S.T){clearInterval(S.T);S.T=null}S.v=b.dataset.v;try{localStorage.setItem('ley32123.v',S.v)}catch(e){}render()});
 $$('[data-g]').forEach(b=>b.onclick=()=>{if(S.T){clearInterval(S.T);S.T=null}S.g=b.dataset.g;S.sel='';render()});
 $$('[data-s]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.s;render()});
 $$('[data-e]').forEach(b=>b.onclick=()=>{S.ent=b.dataset.e;render()});
 $$('[data-pg]').forEach(b=>b.onclick=()=>{S.pg=b.dataset.pg;S.h=-1;render()});
 $$('[data-h]').forEach(b=>{const x=HITOS[+b.dataset.h];b.onclick=()=>{S.h=+b.dataset.h;render()};
  if(b.tagName.toLowerCase()==='g'){b.onmousemove=e=>tipShow(`<div class="t">${flarga(x)}</div>${x.t}`,at(e));b.onmouseleave=tipHide}});
 const ho=$('.hl li.on');if(ho){let a=ho;while(a.previousElementSibling&&/^(hy|yr)$/.test(a.previousElementSibling.className))a=a.previousElementSibling;ho.parentElement.scrollTop=Math.max(0,a.offsetTop-4)}
 const tw=$('.tlw');if(tw&&tw.scrollWidth>tw.clientWidth)tw.scrollLeft=tw.scrollWidth*(+tw.dataset.hoy)-tw.clientWidth*.35;
 const bp=$('#bPrev'),bn=$('#bNext'),bl=$('#bPlay');if(bp)bp.onclick=()=>paso(-1);if(bn)bn.onclick=()=>paso(1);if(bl)bl.onclick=play;
 $$('[data-art]').forEach(b=>{const a=ART[b.dataset.art];
  b.onmouseenter=()=>tipShow(`<div class="t">${a[0]}</div>${a[1].replace(/<br>/g,' ').slice(0,360)}${a[1].length>360?'…':''}<div class="h">Clic para leer el texto completo</div>`,b.getBoundingClientRect());
  b.onmouseleave=tipHide;b.onclick=e=>{e.stopPropagation();tipHide();verArt(b.dataset.art)}});
 $$('.mf').forEach(gr=>{const ids=gr.dataset.ids.split(','),f=MAPA_F.find(x=>x.id===gr.dataset.f);
  gr.onclick=()=>{if(S.v==='quien'){S.v='mapa';S.g=f.g}else if(!S.g)S.g='';S.sel=f.id;render()};
  let html='';
  if(ids.length>1)html=`<div class="t">${ids.length} intercambios por este tramo</div>${ids.map(i=>MAPA_F.find(x=>x.id===i).t).join(' · ')}`;
  else if(f.id!==S.cur)html=`<div class="t">${f.t}</div>${f.tip}`;
  gr.onmousemove=e=>html?tipShow(html,at(e)):tipHide();gr.onmouseleave=tipHide});
 $$('.mn').forEach(gr=>{const k=gr.dataset.n,N=MAPA_N[k];
  gr.onclick=()=>{S.ent=k;if(S.v!=='quien'){S.v='quien'}render()};
  const cur=MAPA_F.find(x=>x.id===S.cur);
  const fr=S.v==='mapa'&&cur&&(cur.de===k||cur.a===k)?(cur.de===k?cur.d.charAt(0).toUpperCase()+cur.d.slice(1):cur.r):N.d;
  gr.onmousemove=e=>tipShow(fr,at(e));gr.onmouseleave=tipHide});
 $$('.mz').forEach(gr=>{const z=MAPA_Z.find(x=>x.t===gr.dataset.z);gr.onmousemove=e=>tipShow(`<div class="t">${z.t}</div>${z.d}`,at(e));gr.onmouseleave=tipHide});
}
render();
</script>
</body>
</html>
