const NORMAS=[["Ley", "Ley N° 32123", "24/09/2024", "Congreso", "Ley de Modernización del Sistema Previsional Peruano: crea el Sistema Integral Previsional, multipilar.", "2024-09-24_Ley-32123_Modernizacion-Sistema-Previsional", "https://busquedas.elperuano.pe/dispositivo/NL/2328060-1"], ["Reg", "D.S. N° 189-2025-EF", "05/09/2025", "MEF", "Reglamento de la Ley 32123 (118 artículos): afiliación, PAST, aportes, pilares, traslados.", "2025-09-05_DS-189-2025-EF_Reglamento-Ley-32123", "https://busquedas.elperuano.pe/dispositivo/NL/2435408-1"], ["L32445", "Ley N° 32445", "20/09/2025", "Congreso", "Retiro extraordinario de hasta 4 UIT; deroga el aporte obligatorio de los independientes.", "2025-09-20_Ley-32445_Retiro-4UIT-y-modifica-Ley-32123", "https://busquedas.elperuano.pe/dispositivo/NL/2440732-1"], ["DS061", "D.S. N° 061-2026-EF", "16/04/2026", "MEF", "Adecúa el reglamento a la Ley 32445: aporte facultativo de los independientes.", "2026-04-16_DS-061-2026-EF_Modifica-Reglamento", "https://busquedas.elperuano.pe/dispositivo/NL/2506683-2"], ["RJ28", "R.J. N° 000028-2026-JF-ONP", "02/03/2026", "ONP", "Plan de Implementación de la PAST y de la Ficha del Afiliado (FAS).", "2026-03-02_RJ-000028-2026-JF-ONP_Plan-Implementacion-PAST-FAS", "https://www.gob.pe/institucion/onp/normas-legales/7801258-000028-2026-jf-onp"], ["RJ79", "R.J. N° 000079-2026-JF-ONP", "15/05/2026", "ONP", "Lineamientos para la gobernanza de la PAST (ONP–SBS).", "2026-05-15_RJ-000079-2026-JF-ONP_Lineamientos-Gobernanza-PAST", "https://www.gob.pe/institucion/onp/normas-legales/8136370-000079-2026-jf-onp"], ["ROT", "R.P.E. N° 000081-2026-PE-ONP", "11/09/2026", "ONP", "Reglamento Operativo de Traslados entre el SNP y el SPP.", "2026-09-11_RPE-000081-2026-PE-ONP_Reglamento-Operativo-Traslados", "https://www.gob.pe/institucion/onp/normas-legales/8587102-000081-2026-pe-onp"], ["ROP", "R.P.E. N° 000087-2026-PE-ONP", "13/09/2026", "ONP", "Reglamento operativo de la pensión mínima y proporcional especial del SPP.", "2026-09-13_RPE-000087-2026-PE-ONP_Reglamento-Pension-Minima-Proporcional-SPP", "https://www.gob.pe/institucion/onp/normas-legales/8592051-000087-2026-pe-onp"]];
const ART={"DS061 20": ["D.S. N° 061-2026-EF · nuevo texto del Reglamento · art. 20", "Artículo 20. Regla especial por inicio de actividad laboral<br>20.1 Toda persona que no se encuentre afiliada a un régimen previsional, o que se encuentre dentro del plazo de elección para afiliarse al Sistema, y que inicie una relación laboral de dependencia debe afiliarse al Sistema y elegir entre el SNP o el SPP hasta diez (10) días calendario siguientes de iniciado su vínculo laboral. El trabajador debe entregar a su empleador una copia física o electrónica de su constancia de afiliación, en caso de que no se pueda verificar su condición de afiliación al SNP o SPP, a fin de que el empleador pueda realizar la retención y pago de su aporte previsional al régimen correspondiente.<br>20.2 Es obligación del empleador, verificar en la PAST la condición de afiliado al Sistema de su trabajador. En caso de no ser posible dicha verificación, el empleador está obligado a solicitar la constancia de afiliación del trabajador al Sistema. (...)”."], "L32445 1": ["Ley N° 32445 · art. 1", "Artículo 1. Objeto de la Ley La presente ley tiene por objeto autorizar de manera extraordinaria y facultativa a todos los afiliados al Sistema Privado de Administración de Fondos de Pensiones, sin ninguna excepción, el retiro de los fondos acumulados en sus cuentas individuales de capitalización, hasta por el monto de cuatro unidades impositivas tributarias (4 UIT)."], "L32445 2": ["Ley N° 32445 · art. 2", "Artículo 2. Procedimiento de solicitud de retiro El procedimiento para el retiro extraordinario y facultativo de los fondos pensionarios es el siguiente:<br>a) Los afiliados presentan su solicitud de manera física o virtual dentro de los noventa días calendario posteriores a la vigencia del reglamento de la presente ley.<br>b) Se abona un monto de hasta una unidad impositiva tributaria (1 UIT) cada treinta días calendario. El primer desembolso se realiza a los treinta días calendario de presentada la solicitud ante la administradora privada de fondos de pensiones a la que pertenezca el afiliado.<br>c) En el caso de que el afiliado desista de continuar retirando los fondos de su cuenta individual de capitalización, puede solicitarlo por única vez a la administradora privada de fondos de pensiones diez días calendario antes del siguiente desembolso."], "L32445 4": ["Ley N° 32445 · art. 4", "Artículo 4. Apertura de cuentas en el sistema financiero 4.1. Las empresas del sistema financiero, incluido el Banco de la Nación, y las empresas emisoras de dinero electrónico pueden abrir cuentas, masiva o individualmente, a nombre de beneficiarios identificados por las administradoras privadas de fondos de pensiones (AFP) que instruyen los pagos, sin necesidad de la celebración previa de un contrato ni de la aceptación por parte del titular de la cuenta.<br>4.2. Las empresas del sistema financiero y las empresas emisoras de dinero electrónico pueden compartir con las AFP que instruyen los pagos información de identificación de la cuenta o cuentas preexistentes de los beneficiarios, incluyendo el Código de Cuenta Interbancario (CCI), lo cual está exceptuado del alcance del secreto bancario. Las AFP que instruyen los pagos pueden compartir los datos personales de los beneficiarios que resulten estrictamente necesarios para el propósito descrito en el párrafo 4.1., lo cual se considera dentro de lo dispuesto en el numeral 9 del artículo 14 de la Ley 29733, Ley de Protección de Datos Personales, únicamente con la finalidad de efectuar la transferencia de fondos.<br>4.3. Las cuentas a las que se hace referencia en el párrafo 4.1. pueden ser utilizadas por el titular para fines adicionales al depósito y retiro de los fondos transferidos. También pueden ser cerradas por las empresas del sistema financiero y las empresas emisoras de dinero electrónico cuando dichas cuentas no mantengan saldo por un período mínimo de seis meses o a solicitud del titular.<br>4.4. La Superintendencia de Banca, Seguros y Administradoras Privadas de Fondos de Pensiones (SBS) establece las características y condiciones adicionales para la apertura, uso y cierre de estas cuentas a través de normas reglamentarias."], "Ley 10.1": ["Ley N° 32123 · art. 10.1", "10.1. Para la recuperación de aportes del SNP, la Sunat aplica los procedimientos tributarios establecidos para recuperar los aportes adeudados, tanto de forma voluntaria como coactiva, conforme lo dispone el Código Tributario. Asimismo, en caso de que el agente de retención no cumpla con la obligación de retener los aportes, se aplica lo señalado en el numeral 2 del artículo 18 del Código Tributario."], "Ley 14.1": ["Ley N° 32123 · art. 14.1", "14.1. El SNP es un régimen de repartos. La ONP se encuentra a cargo de su administración."], "Ley 14.2": ["Ley N° 32123 · art. 14.2", "14.2. El SPP es un régimen de capitalización individual que es administrado por:<br>a) Las administradoras de fondos de pensiones (AFP) y las empresas del sistema financiero (ESF) establecidas en los literales a),<br>c) y<br>d) del artículo 16 de la Ley 26702, Ley General del Sistema Financiero y del Sistema de Seguros y Orgánica de la Superintendencia de Banca y Seguros, en igualdad de condiciones de competencia y bajo las disposiciones y salvaguardas establecidas en el TUO de la Ley del Sistema Privado de Pensiones y normas complementarias, y que se acogen a todas las obligaciones, responsabilidades y derechos que establece dicho TUO."], "Ley 16.1": ["Ley N° 32123 · art. 16.1", "16.1. Dentro del pilar contributivo, tanto el SNP como el SPP llevan a cabo sus procesos para recabar los aportes previsionales, bajo las plataformas que cada uno de ellos les provea, incluidas las entidades centralizadoras, según la regulación aplicable."], "Ley 16.2": ["Ley N° 32123 · art. 16.2", "16.2. Los pagos de los aportes al Sistema, sean obligatorios o voluntarios, son realizados mediante aplicativo móvil, billetera móvil, agentes bancarios u otros mecanismos innovadores conforme se establezca en las normas reglamentarias. CAPÍTULO IV PILARES SUBCAPÍTULO I PILAR NO CONTRIBUTIVO"], "Ley 17": ["Ley N° 32123 · art. 17", "Artículo 17. Administración La ONP es responsable de administrar el pago y articular el pilar no contributivo de forma progresiva, el que se financia con recursos del tesoro público tales como un porcentaje de los saldos anuales de balance y otros recursos que el Estado considere."], "Ley 20": ["Ley N° 32123 · art. 20", "Artículo 20. Registro informático Todo perceptor de una pensión no contributiva es registrado en el Aplicativo Informático para el Registro Centralizado de Planillas y de Datos de los Recursos Humanos del Sector Público (AIRHSP). SUBCAPÍTULO II PILAR SEMICONTRIBUTIVO"], "Ley 24": ["Ley N° 32123 · art. 24", "Artículo 24. Financiamiento Las pensiones del pilar semicontributivo se financian de acuerdo con lo siguiente:<br>a) En el SNP, el financiamiento se realiza a través de las fuentes establecidas según la normativa vigente.<br>b) En el SPP, el financiamiento proviene de los recursos de la CIC de cada afiliado y con el producto de la redención del bono de reconocimiento, de ser el caso, los cuales se complementan con recursos públicos."], "Ley 30": ["Ley N° 32123 · art. 30", "Artículo 30. Pago de las prestaciones El pago de las prestaciones que otorga este pilar está a cargo de:<br>a) La ONP, para el caso del SNP y los regímenes que tiene a cargo.<br>b) Las entidades mencionadas en el párrafo 14.2 del artículo 14, para el caso del SPP y los regímenes que lo componen; así como por las empresas de seguros, cuando intervengan directamente en el pago de una pensión de jubilación, invalidez, sobrevivencia y gastos de sepelio.<br>c) No hay incompatibilidad para la percepción de prestaciones contributivas, que cubran o no el mismo riesgo, en el Sistema."], "Ley 35": ["Ley N° 32123 · art. 35", "Artículo 35. Pensión por consumo 35.1. Se crea el aporte por consumo, que es un aporte complementario de naturaleza previsional, proveniente de los gastos por consumo realizados por los afiliados al Sistema, debidamente sustentados en boletas de venta electrónicas que contengan el o los nombres y apellidos de la persona natural y su número de documento nacional de identidad (DNI) correspondiente, y siempre que se cumpla con lo previsto en el presente artículo y en el párrafo 36.1 del artículo 36 de la presente ley. El aporte por consumo se financia con recursos del tesoro público consignados y autorizados en el presupuesto público de cada año.<br>35.2. El aporte por consumo es intangible e inembargable, no puede ser destinado para otro fin que no sea de carácter previsional y se mantiene en la cuenta del afiliado al Sistema hasta su jubilación.<br>35.3. El aporte por consumo es administrado por el SPP, a través de una cuenta especial, que puede estar sujeta al pago de una comisión. Las características, funcionamiento, mecanismos de aportación, entre otros, son establecidas en los reglamentos correspondientes.<br>35.4. Las EAF crean la cuenta especial de sus afiliados, y en el caso de los afiliados al SNP, estos solicitan su creación en la EAF de su elección, conforme al proceso que la SBS establezca para ello.<br>35.5. El aporte por consumo cesa cuando el afiliado accede a una prestación previsional de acuerdo al SNP o SPP o cumpla 65 años, lo que suceda primero.<br>35.6. El saldo acumulado por los aportes por consumo forma parte del capital para prestaciones previsionales de los afiliados al Sistema de acuerdo a los lineamientos que se establezcan en el reglamento de la presente ley.<br>35.7. El aporte por consumo se calcula con periodicidad anual y equivale al 1% de la sumatoria de los importes de la venta, la cesión en uso y/o del servicio prestado a que se refiere el inciso 3.8 del numeral 3 del artículo 8 del Reglamento de Comprobantes de Pago, aprobados por la Resolución de Superintendencia 007-99/SUNAT que figuran en las boletas de venta electrónicas emitidas dentro de cada ejercicio fiscal, siendo que el consumo total materia de cálculo de la pensión no debe exceder las 8 UIT anuales.<br>35.8. Para efectos de lo previsto en el presente párrafo:<br>a. No se consideran las boletas de venta electrónicas cuyos importes de venta, cesión en uso y/o servicio prestado sean superiores a setecientos y 00/100 soles (S/ 700).<br>b. De haberse emitido notas de débito o notas de crédito electrónicas respecto de las boletas de venta electrónicas a que se refiere el numeral anterior, se considera el importe ajustado por estas, incluso para determinar si se supera o no el monto de setecientos y 00/100 soles (S/ 700). Las referidas notas de débito y crédito son las emitidas hasta el 31 de diciembre de cada ejercicio fiscal.<br>c. En el reglamento se señalan, para efecto del cálculo anual, desde cuándo y hasta cuándo, según corresponda, se consideran las boletas de venta electrónicas en aquellos casos en los que en el transcurso del ejercicio fiscal ocurran los supuestos que se mencionan en el párrafo 36.2. del artículo 36 de la presente ley. A las notas de débito o notas de crédito electrónicas que se emitan ajustando los importes de las referidas boletas de venta, se les aplica lo dispuesto en el literal anterior."], "Ley 41": ["Ley N° 32123 · art. 41", "Artículo 41. Administración del Fondo Complementario de Jubilación para Trabajadores Pesqueros 41.1 Los recursos del FCJTP son administrados por el FCR, contabilizándose en forma independiente de los demás recursos a su cargo. 41.2 La administración de los recursos se rige por los lineamientos que para tal efecto establezca el Directorio del FCR. 41.3 La Sunat transfiere el monto recaudado por dicho aporte al FCR, luego de deducir la comisión respectiva en favor de la Sunat y la comisión para atender el gasto de administración del beneficio complementario en que incurra la ONP, calculada esta última en el equivalente al tope del porcentaje previsto en el inciso a. del numeral 3 del artículo 12 del Reglamento de la Ley 28532, aprobado por el Decreto Supremo 118-2006-EF, aplicado sobre la suma de la recaudación."], "Ley 42": ["Ley N° 32123 · art. 42", "Artículo 42. Administración del beneficio complementario La administración del beneficio complementario del FCJTP se encuentra a cargo de la ONP. En el caso de los pensionistas del SPP, las AFP deben remitir a la ONP la información necesaria para el cálculo del beneficio complementario."], "Ley 8.1": ["Ley N° 32123 · art. 8.1", "8.1. Las aportaciones obligatorias de los afiliados al SNP no pueden ser inferiores al 13 % de la remuneración mensual asegurable o pensionable a cargo del afiliado, sin perjuicio de los aportes que legalmente corresponde realizar al empleador o al Estado."], "Ley 8.2": ["Ley N° 32123 · art. 8.2", "8.2. En el caso del SPP, el aporte obligatorio está constituido por:<br>a) El 10 % sobre la remuneración asegurable destinada a la CIC.<br>b) Un porcentaje de la remuneración asegurable, destinada a financiar las prestaciones de invalidez y sobrevivencia y un monto destinado a financiar la prestación de gastos de sepelio, conforme a las reglas dispuestas para ello en la normativa vigente del SPP.<br>c) Una comisión sobre la base de lo establecido en el inciso<br>c) del artículo 30 del TUO de la Ley del Sistema Privado de Administración de Fondos de Pensiones, aprobado por el Decreto Supremo 054-97-EF."], "Ley 8.ª DCF": ["Ley N° 32123 · 8.ª disposición complementaria final", "OCTAVA. Atención progresiva de los aportes realizados de manera incorrecta al SNP<br>a) A la edad de jubilación, las personas afiliadas al SPP que tengan aportes declarados y pagados de manera incorrecta al SNP por parte de sus empleadores pueden solicitar el pago de una pensión ante la ONP, siempre que con solo dichos aportes se cumpla el requisito establecido para el acceso a una pensión.<br>b) Los aportes a considerar en el literal anterior no deben haber sido devueltos por la Sunat, ni haber sido transferidos por la ONP conforme a lo dispuesto en la sétima disposición complementaria final del Decreto Legislativo 1275, o haber sido pagados a través del Régimen de Reprogramación de Pago de Aportes Previsionales al Fondo de Pensiones aprobado a través del artículo 25 del Decreto Legislativo 2750, o el Régimen de Reprogramación de Pago de Aportes Previsionales a los Fondos de Pensiones aprobado a través del Decreto de Urgencia 030- 2019 o cualquier otra reprogramación aprobada previa a la vigencia de la presente ley. En caso de que el aporte haya sido acogido dentro de las reprogramaciones aprobadas conforme a las normas citadas en el presente numeral pero no han sido consignados en la CIC de la persona afiliada, los aportes pueden ser considerados para el beneficio establecido en el literal a).<br>c) El acceso a una pensión en el SNP no limita a las personas afiliadas al SPP a"], "Ley 9.ª DCF": ["Ley N° 32123 · 9.ª disposición complementaria final", "NOVENA. Incentivos al ahorro<br>a) A fin de incentivar el ahorro, el MEF de manera anual y de conformidad con las previsiones presupuestarias, puede asignar recursos del tesoro público para el financiamiento de un aporte complementario equivalente al aporte voluntario con fin previsional realizado directamente por las personas afiliadas al Sistema.<br>b) El aporte del Estado no puede exceder del monto equivalente a una (1) unidad de aporte sobre una remuneración mínima vital anualmente.<br>c) En caso de que los aportes voluntarios con fin previsional, sujetos al incentivo, realizados por las personas afiliadas al Sistema, excedan los recursos destinados por el Estado para el financiamiento anual del aporte complementario, la distribución de estos recursos se realiza de manera proporcional al aporte realizado por cada beneficiario y al tope establecido en el numeral 2 de la presente disposición.<br>d) El aporte del Estado se efectúa a favor de los afiliados que realizan aportes voluntarios con fin previsional y que perciban ingresos mensuales que no excedan el 0.25 de la UIT.<br>e) A través del reglamento, se definen los mecanismos para la implementación de la presente disposición. El MEF realiza cada tres (3) años una evaluación del incentivo al ahorro, cuyos resultados permiten revisar la continuidad de la presente disposición, así como la introducción de ajustes en los mecani"], "RJ28 1": ["R.J. N° 000028-2026-JF-ONP · Plan de Implementación de la PAST y la FAS · art. 1", "Artículo 1. Aprobación del Plan de Implementación de la PAST y de la FAS Apruébase el Plan de Implementación de la Plataforma de Afiliación Segura y Transparente (PAST) y de la Ficha del Afiliado al Sistema (FAS), el que, como Anexo, forma parte integrante de la presente Resolución."], "RJ79 1": ["R.J. N° 000079-2026-JF-ONP · Lineamientos de gobernanza de la PAST · art. 1", "Artículo 1. Aprobación de Lineamientos para la Gobernanza de la PAST Apruébese los Lineamientos para la Gobernanza de la Plataforma de Afiliación Segura y Transparente (PAST), los que, como Anexo, forman parte integrante de la presente Resolución."], "ROP 10": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 10", "Artículo 10.- Transferencia de fondos y financiamiento de la prestación 10.1 Una vez reconocida la pensión en el pilar semicontributivo, mediante acto administrativo firme comunicado por la ONP al afiliado y a la EAF, es decir, cuando no se haya interpuesto recurso administrativo dentro del plazo establecido o habiéndose presentado, este haya sido resuelto, la EAF realiza la transferencia a la ONP de los recursos de la CIC, incluyendo, de corresponder, el monto redimido del BdR.<br>10.2. Las EAF deben remitir el Archivo Plano de Transferencia (APT-SPP) conforme a la estructura señalada en el Anexo 4, para lo cual previamente deben cerrar la CIC y transferir los recursos a una cuenta por pagar, conforme a las disposiciones que emita la Superintendencia para dicho fin.<br>10.3. La ONP valida el APT-SPP dentro del plazo máximo de un (1) día hábil, de no existir observaciones. Asimismo, la ONP gestiona con la entidad bancaria la habilitación del monto a transferir y remite a la EAF el ticket para la transferencia de la CIC, como máximo al día hábil siguiente. Caso contrario, la ONP comunica a la EAF las inconsistencias detectadas para la subsanación del archivo.<br>10.4. El plazo para efectuar la transferencia de dichos recursos es de quince (15) días calendario, contados a partir del acto administrativo firme o agotada la vía administrativa.<br>10.5. La EAF debe transferir a la ONP, con cargo a formar parte del FCR-SPP, los recursos que reciba posteriormente y que correspondan a un afiliado con pensión en el pilar semicontributivo. Estos recursos no son objeto de devolución, tampoco generan un derecho a percibir un nuevo monto de pensión, puesto que la pensión otorgada tiene carácter definitivo.<br>10.6. La ONP realiza el pago de las prestaciones de jubilación e invalidez del pilar semicontributivo para los afiliados al SPP, una vez que reciba la transferencia de fondos del total del saldo de la CIC."], "ROP 11": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 11", "Artículo 11.- Inicio de la pensión 11.1 El inicio de la pensión se establece a partir de la fecha de presentación de la solicitud por parte del afiliado ante la EAF, siempre que este cumpla con las condiciones y requisitos exigidos para su otorgamiento. 11.2 La ONP procede a gestionar la apertura de la cuenta bancaria a nombre del pensionista a fin de que pueda hacer efectivo el cobro de su pensión. 11.3 El pago de las pensiones se realizará en las fechas que se establecen en el cronograma de pago de pensiones semicontributivas que se apruebe mediante Resolución Viceministerial del Ministerio de Economía y Finanzas. 11.4 Mensualmente, la ONP envía reportes a las EAF y a la SBS de los pensionistas con abonos realizados y sobre los pensionistas fallecidos. En caso de que las EAF tomen conocimiento del fallecimiento de un afiliado que cuenta con una pensión del pilar semicontributivo, debe informar a la ONP de dicho suceso, conforme al formato incluido en la Resolución Jefatural N° 110-2003-JEFATURA/ONP o norma que la sustituya. TÍTULO III PRESTACIONES DE SOBREVIVENCIA"], "ROP 23": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 23", "Artículo 23.- Pago en la cuenta de los solicitantes 23.1 La ONP gestiona la apertura de las cuentas bancarias exclusivamente en el Banco de la Nación, a nombre de los solicitantes, a fin de viabilizar el pago de los gastos de sepelio.<br>23.2. El pago se realizará en las mismas fechas que se establecen en el cronograma de pago de las pensiones que administra la ONP, teniendo en cuenta el mes de pago indicado en la resolución que reconoce el beneficio.<br>23.3. Asimismo, procede a gestionar la planilla para el pago de gastos de sepelio, los que serán financiados con cargo al fondo de la cuenta FCR-SPP. En caso el fondo resulte insuficiente, la planilla de pago de gastos de sepelio se financiará con recursos del Tesoro Público.<br>23.4. El financiamiento de los gastos de sepelio será asumido por la ONP sin exceder el límite establecido por la SBS para el SPP."], "ROP 7": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 7", "Artículo 7.- Presentación de la solicitud de pensión de jubilación o invalidez en el pilar semicontributivo 7.1 Sobre la base de la información proporcionada por la EAF, en caso el afiliado decida voluntariamente iniciar su trámite de acceso a una prestación del pilar semicontributivo, lo realizará a través de los canales de atención que las EAF dispongan.<br>7.2. En caso el afiliado estuviera imposibilitado de efectuar el trámite, podrá realizarlo mediante un representante, sujetándose a las disposiciones emitidas por la SBS sobre el particular.<br>7.3. La solicitud de pensión de jubilación o invalidez del pilar semicontributivo, corresponde al Anexo 01 del presente reglamento operativo, debiendo tener en consideración lo siguiente:<br>a. Documentación que permita sustentar los aportes realizados al SNP, anteriores a julio de 1999, los cuales, complementados con los aportes realizados al SPP, permitan alcanzar las UdA requeridas para el acceso a la prestación del pilar semicontributivo, en los casos en que no se haya tramitado el BdR. Para ello, el afiliado puede presentar, entre otros, copias de los siguientes documentos: - Boletas de pago. - Liquidación de tiempo de servicios. - Certificado de retención de impuesto de quinta categoría. - Comprobantes de pago de aportaciones para los períodos de aportación como asegurado facultativo.<br>b. Para el caso de trabajadores dependientes: señalar que adjunta un documento que acredite el cese en el trabajo. No obstante, en caso de que el afiliado no pueda presentar dicha documentación, la EAF puede señalar en el Anexo 01, la condición del vínculo laboral, conforme a la información consignada en sus sistemas por los empleadores. Para el caso de trabajadores independientes: declarar haber dejado de percibir rentas de cuarta categoría.<br>c. Especificaciones adicionales.<br>7.4. El formato de solicitud de pensión de jubilación o invalidez debe ir acompañado de los siguientes documentos, en caso de corresponder:<br>a. Partida de nacimiento que acredite el entroncamiento filial, en caso de solicitar reconocimiento de UdA por hijos.<br>b. Para el caso de trabajadores dependientes, adjuntar un documento que acredite el cese en el trabajo, cuando corresponda.<br>7.5. Tratándose de una solicitud de una pensión de invalidez, debe adjuntar, además, el dictamen médico emitido por el comité médico del SPP (COMAFP o COMEC).<br>7.6. El afiliado debe presentar declaraciones juradas referidas a la información sobre el monto de pensión y las UdA requeridas, al carácter irreversible y voluntario del acceso al pilar, el cese de la relación laboral, reconocimiento excepcional de UdA por hijo, entre otros aspectos que se encuentran estipulados en el formato de solicitud del Anexo 1.<br>7.7. Tratándose de los afiliados que indiquen haber realizado aportes al SNP y que no hubieran tramitado el BdR por esos aportes, autorizan a través de una declaración jurada para que la ONP considere los aportes que mantiene en sus registros como unidades de aportes para el acceso a la prestación del pilar semicontributivo; consecuentemente, estos aportes no podrán ser usados para un posterior bono de reconocimiento, en caso se acceda a una prestación del pilar semicontributivo."], "ROP 8": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 8", "Artículo 8.- Proceso de evaluación de requisitos y documentación anexa a la solicitud de prestaciones a cargo de la EAF 8.1 Revisión preliminar por parte de la EAF: recibida la solicitud, en el plazo máximo de cinco (5) días hábiles, la EAF debe revisar que toda la documentación requerida sea presentada por el afiliado y con relación a la información del SPP, evalúa el cumplimiento de los requisitos, para lo cual realiza lo siguiente:<br>a. Determina si el monto de la pensión del afiliado al SPP, bajo la modalidad de retiro programado, resulta inferior al monto de las prestaciones otorgadas en el pilar semicontributivo. Para dicho cálculo, se considera la totalidad del saldo de la CIC, que incluye la rentabilidad generada y todos los tipos de aportes, tales como aportes obligatorios, aportes voluntarios con fin previsional, aportes de pensión por consumo, así como los recursos provenientes del BdR acreditados en la CIC, o la proyección de su valor de redención, cuando este haya sido emitido, pero aún no redimido.<br>b. En caso el afiliado no haya realizado retiros de su CIC, la cantidad de las UdA se determina considerando la totalidad de los aportes realizados en el SPP, conforme a lo dispuesto en el numeral 42.4 del Reglamento de la Ley N° 32123.<br>c. En caso el afiliado haya realizado retiros de su CIC, procede según lo siguiente:<br>i. Determina el número y monto de retiros efectuados en la CIC al amparo del artículo 4 de la Ley N° 29426, los artículos 40 y 42-A del TUO de la Ley del SPP, el Decreto de Urgencia N° 034-2020, la Ley N° 31017, el Decreto de Urgencia N° 038-2020, la Ley N° 31068, la Ley N° 31192, la Ley N° 31478, la Ley N° 32002, el retiro extraordinario y facultativo de la Ley N° 32445, y, otras de naturaleza similar.<br>ii. Determina el número de las UdA efectivas requeridas para acceder a las prestaciones del pilar semicontributivo, conforme a lo dispuesto en el artículo 44 del Reglamento de la Ley N° 32123. Para tal efecto, el coeficiente de retención se determina considerando el saldo CIC de aportes obligatorios previo al momento de cada retiro. Los aportes en cobranza no se contabilizan como UdA.<br>iii. En el caso de que el afiliado cuente con resolución de otorgamiento de BdR y no se haya producido retiros con posterioridad a su redención, la EAF contabiliza las UdA por el período de aportes reconocido en la resolución de BdR consentida, en adición a las UdA efectivas por aportes al SPP.<br>d. Identifica los períodos de devengue comprendidos desde la fecha de publicación del Reglamento hasta el mes anterior a la presentación de la solicitud, en los cuales no se hubiesen generado UdA por ausencia de aportes obligatorios, a fin de que las UdA faltantes puedan ser completadas mediante aquellas provenientes del aporte por consumo y/o de la devolución de pagos en exceso del impuesto a la renta.<br>e. En el caso de que el afiliado cuente en un mismo período de devengue, con remuneraciones provenientes de más de un (1) empleador, los aportes obligatorios efectuados sobre dichas remuneraciones se consideran de manera conjunta a efectos de la generación de la UdA:<br>i. Cuando la suma de las remuneraciones asegurables supere o sea igual a la RMV, se genera una (1) UdA en dicho período. Para tal efecto, cada aporte es considerado proporcionalmente, constituyendo fracciones de UdA que, en conjunto, conforman la UdA correspondiente.<br>ii. Cuando la suma de las remuneraciones asegurables no supere la RMV, se genera una fracción de UdA en dicho período. Para tal efecto, cada aporte es considerado proporcionalmente y en su conjunto, genera la fracción de UdA indicada.<br>f. El cálculo de la UdA se realiza considerando la tasa de aporte vigente en el mes de devengue de cada aporte efectuado, de acuerdo con las siguientes reglas:<br>i. En caso de un único empleador o empresa en el mes devengue: \u0003\u0003\u0003ǡ  \u0003 ǡ  ii. En caso de más un empleador o empresa para el mismo mes de devengue: La UdA SPP se calculan de forma individualizada por empleador o em-presa, y los resultados se debe consignar en el Anexo N° 03. \u0003\u0003ǡǡǡ \u0003ǡ ǡ  \u0003ǡ ǡ   La UdA del mes de devengue k es la suma de fracciones de UdAs correspondiente a cada empleador o empresa. \u0003\u0003\u0003\u0003\u0003ǡ   - En caso de que la RAMk y la RAMl,k de cada uno de los empleadores o empresas sea menor a una RAMk: \u0003\u0003ǡǡǡ \u0003ǡ ǡ  \u0003ǡ ǡ    ǡ     Notación para las fórmulas: k : Mes de devengue. UdA SPPk : UdA del SPP en el mes de devengue k. Aportek : Monto pagado y acreditado en la CIC correspondiente al mes de devengue k. Tasa SPPk : Tasa de aporte del SPP vigente en el mes de devengue k. Incluye, en los casos que corresponda, la tasa de aporte complementario del trabajador y del empleador de la Ley N° 27252 y su reglamento, aprobado por Decreto Supremo Nº 164-2001-EF y sus modificatorias. RAMk : Remuneración (ingreso) asegurable mensual correspondiente al mes de devengue k. Si el afiliado percibe más de una remuneración en dicho mes, se considera la suma de todas ellas. RMVk : Remuneración Mínima Vital vigente en el mes de devengue k. l : Empleador o empresa. p : Número de empleadores o empresas para un mismo mes de devengue k. UdA SPPl,k : UdA del SPP correspondiente al empleador o empresa l para el mes de devengue k. Aportel,k : Monto pagado y acreditado en la CIC correspondiente al mes de devengue k y al empleador o empresa l. Tasa SPPl,k : Tasa de aporte del SPP vigente en el mes de devengue k, correspondiente al empleador o empresa l. Incluye, en los casos que corresponda, la tasa de aporte complementario del trabajador y del empleador de la Ley N° 27252 y su reglamento, aprobado por Decreto Supremo Nº 164-2001-EF y sus modificatorias. RAMl,k : Remuneración (ingreso) asegurable mensual correspondiente al mes de devengue k y al empleador o empresa l.<br>g. En el caso de las solicitudes de pensión de invalidez, evalúa el número de aportes realizados con anterioridad a la emisión del dictamen médico, por aquellos afiliados que únicamente han estado afiliados al SPP y que son requeridos para el acceso a las pensiones de invalidez del pilar semicontributivo, conforme al inciso 6.2.4 del artículo 6 del presente reglamento operativo y tomando en consideración lo establecido en el artículo 44 del Reglamento.<br>h. Verifica que el afiliado no haya efectuado retiros con posterioridad a la vigencia de la Ley 32123 y su Reglamento, salvo aquellos retiros establecidos en los artículos 40 y 42-A del TUO de la Ley del SPP y de la Ley N° 32445.<br>i. Verifica que la partida de nacimiento que presente el afiliado permita establecer el entroncamiento filial del hijo, para el reconocimiento excepcional de UdA por hijo que sea solicitado, en el caso de que el afiliado no acredite los aportes necesarios para acceder al beneficio del pilar semicontributivo.<br>j. Valida que el afiliado no tenga la condición de pensionista por derecho propio en el SPP.<br>k. Valida que las prestaciones de invalidez de los afiliados al SPP no estén bajo la cobertura del seguro previsional.<br>8.2. Comunicación de deficiencias o inconsistencias: concluída la revisión de la documentación presentada y verificación del cumplimiento de requisitos exigidos en el SPP para el acceso al pilar semicontributivo, cuando la EAF advierta el incumplimiento de requisitos respecto del SPP o la insuficiencia de la documentación presentada, comunica al afiliado dichas deficiencias o inconsistencias, para las gestiones correspondientes, conforme a las disposiciones aplicables en el SPP.<br>8.3. Presentación por insistencia: si el afiliado es informado de la existencia de deficiencias o inconsistencias en su solicitud, puede solicitar ante la EAF la continuidad del trámite ante la ONP, indicándose ello en la solicitud.<br>8.4. Traslado de solicitud a la ONP: La EAF remite las solicitudes de sus afiliados a la ONP dentro del plazo máximo de tres (3) días hábiles de culminada la evaluación de la solicitud, adjuntando:<br>a. La solicitud debidamente firmada y la documentación anexa correspondiente, a través de los canales que la ONP establezca.<br>b. El Formato APC-SPP y APD-SPP del Anexo 03, el cual contiene, entre otros, las UdA efectivas calculadas por la EAF.<br>8.5. Revisión documental por parte de la ONP: la ONP revisa en el plazo de un (1) día hábil las solicitudes remitidas por las EAF. Toda solicitud que no cuente con los requisitos documentales de admisibilidad mínimos exigidos para el acceso al pilar semicontributivo, será comunicada por la ONP a la EAF que corresponda, requiriendo la subsanación. La EAF, dentro del plazo de dos (2) días hábiles, comunicará a su afiliado para que proceda con la subsanación en el plazo de dos (2) días hábiles, contados a partir del día siguiente de recibida la comunicación por parte de la EAF.<br>8.6. Traslado de las subsanaciones a la ONP: la EAF remite a través de los canales que la ONP establezca, las subsanaciones a las solicitudes de prestaciones de sus afiliados, dentro del plazo máximo de dos (2) días hábiles de recibida la respuesta por parte del afilado a la EAF, adjuntando las comunicaciones y/o la documentación materia de subsanación, de corresponder, así como el cargo de la comunicación realizada por la EAF a su afiliado."], "ROP 9": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 9", "Artículo 9.- Calificación y emisión de acto administrativo a cargo de ONP 9.1 Recibida la solicitud, la ONP genera el expediente administrativo y evalúa el cumplimiento de los requisitos de acceso a las prestaciones del pilar semicontributivo y determina el tipo de pensión, conforme a lo dispuesto en el Reglamento referido a la pensión mínima y la pensión de jubilación proporcional especial. Asimismo, para que la ONP continúe con la calificación de la solicitud de pensión, valida que el afiliado no tenga la condición de pensionista por derecho propio en alguno de los regímenes previsionales administrados por el Estado, para cuyo efecto verifica dicha información en el AIRHSP.<br>9.2. En caso el afiliado haya presentado documentación para la acreditación de aportes al SNP correspondientes a períodos distintos a los consignados en la resolución del BdR, de existir, la ONP valida dicha documentación y adiciona las UdA que resultan acreditadas a las determinadas por la EAF en el Anexo N° 03. En caso el afiliado no presente documentación, pero solicite que la ONP considere los aportes que obran en sus archivos, así como los que declare el afiliado, estos son reconocidos siempre que la ONP pueda verificar su existencia en sus registros. Para la acreditación de aportes al SNP correspondientes a períodos a partir de julio de 1999, se aplica lo dispuesto en el artículo 45 del Reglamento de la Ley N° 32123.<br>9.3. La ONP califica la solicitud, considerando la información remitida por la EAF y con los aportes al SNP reconocidos por la ONP. El resultado de la evaluación de ONP es comunicado al afiliado y a la EAF, conforme a los siguientes plazos:<br>a. El plazo máximo de evaluación es de treinta (30) días hábiles contados a partir de la recepción de la solicitud en la ONP.<br>b. La ONP emite el acto administrativo pronunciándose sobre la solicitud presentada, notificando el mismo en el plazo de cinco (5) días hábiles.<br>9.4. El afiliado tiene la potestad de interponer recurso administrativo en contra de la decisión de la ONP, en el plazo de quince (15) días hábiles contados a partir del día siguiente de la notificación del acto administrativo, de conformidad con el Texto Único Ordenado (TUO) de la Ley N° 27444. La EAF recibe y remite la solicitud del recurso administrativo y la documentación correspondiente a la ONP, conforme a los plazos establecidos en el numeral 8.4 del presente reglamento operativo para las solicitudes de prestaciones.<br>9.5. La ONP califica el recurso administrativo dentro de los plazos establecidos en el Texto Único Ordenado (TUO) de la Ley N° 27444 y emite el acto administrativo correspondiente, el que es notificado al afiliado y a la EAF en el plazo de cinco (5) días hábiles."], "ROT 13": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 13", "Artículo 13.- Inicio del trámite 13.1 El trámite de traslado del SNP al SPP se inicia a solicitud del afiliado o, para afiliados menores de edad, a solicitud del representante legal, mediante el registro de los datos personales a través de la PAST.<br>13.2. Autenticado el afiliado, la PAST pone a su disposición el Boletín Informativo correspondiente al proceso de traslado, el cual contiene información sobre las condiciones, requisitos y beneficios de cada régimen. El afiliado debe confirmar expresamente su lectura mediante el mecanismo habilitado en la PAST. La falta de confirmación impide la continuación del trámite.<br>13.3. El afiliado procede al registro de la información en el formulario de traslado en la PAST, según los datos de la solicitud de traslado del Anexo N° 01; adicionalmente, registra y valida datos de contacto, los cuales incluyen de manera obligatoria el correo electrónico y el número de teléfono celular.<br>13.4. La PAST, durante la presentación de la solicitud de traslado, realiza validaciones automáticas en línea, destinadas a verificar la identidad del solicitante y el cumplimiento de las condiciones necesarias para el inicio del trámite, con información proveniente de las entidades competentes y de las fuentes oficiales habilitadas, de acuerdo con lo siguiente:<br>a) Validación de identidad, orientada a confirmar la identidad y la supervivencia del solicitante mediante la verificación del documento de identidad y la contrastación de la información personal con las fuentes oficiales habilitadas para tal efecto.<br>b) Validación de condiciones para el traslado, orientada a verificar la situación previsional del solicitante y la inexistencia de impedimentos para el inicio del trámite, lo que comprende, entre otros, la verificación de la afiliación al régimen previsional correspondiente, el estado de afiliación, la condición de pensionista, la existencia de solicitudes o trámites en proceso asociados a beneficios previsionales, el registro en las bases de datos previsionales aplicables, así como la constatación de la lectura del Boletín Informativo.<br>c) Validación de plazo, orientada a verificar el cumplimiento del periodo mínimo de permanencia en el régimen previsional de origen, exigido para la solicitud de traslado cuando no se trate de un primer traslado.<br>13.5. De superar las validaciones señaladas en el numeral precedente, la PAST genera para revisión del afiliado, el pre-registro de la solicitud de traslado con la información validada y solicitada; caso contrario, la PAST no permite continuar con el registro de la solicitud y muestra el mensaje informativo correspondiente.<br>13.6. La solicitud de traslado se considera válidamente presentada con la aceptación de la declaración de veracidad y manifestación expresa de su voluntad a través de los mecanismos de suscripción que establezca la ONP.<br>13.7. Confirmado el registro de la solicitud, la PAST remite la constancia de recepción de la solicitud al solicitante, para su seguimiento."], "ROT 14": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 14", "Artículo 14.- Evaluación de la solicitud 14.1 En el plazo máximo de treinta (30) días hábiles contados a partir de la presentación de la solicitud de traslado en la PAST, la ONP revisa y evalúa la acreditación de los aportes efectuados al SNP, de conformidad con lo dispuesto en el artículo 70 del Decreto Ley N° 19990. 14.2 Dentro del mismo plazo, como resultado de la evaluación del traslado al SPP, la ONP genera el RESIT-SNP según la estructura del Anexo N° 02 y lo incorpora en la PAST para la continuidad del trámite."], "ROT 15": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 15", "Artículo 15.- Comunicación del RESIT-SNP y notificación de la constancia de traslado 15.1 La ONP para la comunicación del RESIT-SNP utiliza los siguientes mecanismos:<br>a) Al afiliado a través de la PAST, en un plazo máximo no mayor a tres (3) días hábiles de haberse emitido.<br>b) A la SBS y a la EAF mediante los mecanismos que se disponga, en el día de haberse emitido. 15.2 La ONP genera la constancia de traslado en el mismo día que se emite el RESIT- SNP:<br>a) Notifica a través de la PAST al afiliado, en un plazo no mayor a tres (3) días hábiles. En caso el afiliado no remita el acuse de recepción, se continua con el procedimiento de notificación de acuerdo con el marco normativo vigente.<br>b) Comunica a la SBS y a la EAF, a través de la PAST, en el mismo día de generada la constancia de traslado del SNP al SPP. 15.3 La ONP ejecuta la baja del afiliado en el SNP, al finalizar el día de la emisión de la constancia de traslado. 15.4 La SBS con la información disponible en la PAST, de manera automática lo incorpora al SPP al día siguiente de la recepción de la constancia de traslado, a partir de lo cual el nuevo estado en el SIPP queda actualizado. CAPÍTULO II: DEL SPP AL SNP"], "ROT 18": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 18", "Artículo 18.- Presentación de la solicitud ante la EAF 18.1 En caso de que el afiliado decida voluntariamente iniciar el trámite de traslado, debe presentar ante la EAF la solicitud correspondiente, en la cual manifieste su voluntad expresa, conforme con las disposiciones normativas de la SBS aplicables al SPP, así como la declaración en la que conste haber tomado conocimiento del Boletín Informativo.<br>18.2. En caso el afiliado sea menor de edad o estuviera imposibilitado de efectuar el trámite, podrá realizarlo mediante un representante debidamente acreditado, quien debe sujetarse a las disposiciones conforme al Código Civil.<br>18.3. El afiliado puede, de manera voluntaria, declarar períodos de aportación al SNP con anterioridad a julio de 1999, a efectos de solicitar el reconocimiento de las UdAs asociadas a dichos aportes, salvo aquellas que provengan de un BdR otorgado. Los períodos declarados serán evaluados por la ONP y, de corresponder, serán reconocidos conforme a la normativa previsional vigente. La presentación de esta solicitud y la evaluación que realice la ONP no suspenden ni interrumpen el trámite de traslado 18.4 La EAF comunica al afiliado el registro de su solicitud para su seguimiento.<br>18.5. La EAF valida los requisitos y condiciones para el traslado, orientada a verificar la situación previsional del solicitante y la inexistencia de impedimentos para el inicio del trámite, lo que comprende -entre otros- la condición de pensionista, la existencia de solicitudes o trámites en proceso que generen movimientos en la CIC, entre otros aspectos que defina la SBS."], "ROT 19": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 19", "Artículo 19.- Generación del RESIT-SPP 19.1 La EAF genera el RESIT-SPP una vez que se haya verificado el cumplimiento de los requisitos aplicables al traslado.<br>19.2. El RESIT-SPP contiene la información según la estructura del Anexo N° 03.<br>19.3. La equivalencia de las UdAs del SPP es determinada y calculada por la EAF, en consideración de la tasa de aporte correspondiente a cada régimen previsional vigente en el mes de devengue de cada aporte efectuado, de conformidad con lo dispuesto en el artículo 43 del Reglamento. En caso el afiliado haya dispuesto de los recursos de la CIC, se ajustan las UdAs equivalentes a efectos de determinar las UdAs efectivas equivalentes. A continuación, se define la regla de cálculo aplicable para cada caso: 19.3.1 Cuando el afiliado no ha dispuesto de sus recursos: En caso la CIC se mantenga íntegra al no haberse dispuesto de sus recursos, la fórmula para determinar el total de UdAs efectivas equivalentes corresponde a la siguiente expresión:      a) En caso de un único empleador o empresa en el mes devengue: \u0003\u0003\u0003ǡ  \u0003 ǡ   \u0003\u0003 ǡ \u0003 \u0003  b) En caso de más un empleador o empresa para el mismo mes de devengue: La UdA SPP y la UdA equivalente se calculan de forma individualizada por empleador o empresa, y los resultados se debe consignar en el Anexo N° 03. \u0003\u0003ǡǡǡ \u0003ǡ ǡ  \u0003ǡ ǡ   \u0003\u0003\u0003\u0003\u0003ǡ   ǡ \u0003\u0003ǡ ǡ \u0003ǡ \u0003\u0003  b.1) En caso de que la RAMk y la RAMl,k de cada uno de los empleadores o empresas sea menor a una RMVk: \u0003\u0003ǡǡǡ \u0003ǡ ǡ  \u0003ǡ ǡ    ǡ     La UdA equivalente del mes de devengue k es la suma de las UdA equivalentes correspondiente a cada empleador o empresa.  ǡ    19.3.2 Cuando el afiliado ha dispuesto de sus recursos: La fórmula para determinar el total de UdAs efectivas equivalentes corresponde a la siguiente expresión:  \u0003ǡ Ⱦ   ǡ Ⱦ   ǡ Ⱦ     ǡ  Ⱦ   ǡ  \u0003ǡ  Donde: Ⱦ \u0003    ǡ \u0003     ǡ \u0003     ǡ  \u0003     ǡ \u0003     a) En caso de un único empleador o empresa en el mes de devengue k: \u0003ǡ  \u0003 ǡ   \u0003\u0003 ǡ \u0003 \u0003  b) En caso de más un empleador o empresa para el mismo mes de devengue k: La UdA SPP y la UdA equivalente se calculan de forma individualizada por empleador o empresa, y los resultados se deben consignar en el Anexo N° 03. \u0003\u0003ǡǡǡ \u0003ǡ ǡ\u0003  \u0003ǡ ǡ   \u0003 \u0003\u0003\u0003\u0003\u0003ǡ   ǡ \u0003\u0003ǡ ǡ \u0003ǡ \u0003\u0003  b.1) En caso de que la RAMk y la RAMl,k de cada uno de los empleadores o empresas sea menor a una RMVk: \u0003\u0003ǡ\u0003ǡǡ \u0003ǡ ǡ  \u0003ǡ ǡ    ǡ     La UdA equivalente del mes de devengue k es la suma de las UdA equivalentes correspondiente a cada empleador o empresa.  \u0003ǡ    Notación para las fórmulas del numeral 19.3: t : Fecha de traslado, la cual corresponde a la fecha de generación del RESIT-SPP.   : UdAs efectivas equivalentes a la fecha de traslado. k : Mes de devengue.   : UdA equivalente para el mes de devengue k. UdA SPPk : UdA del SPP en el mes de devengue k. Aportek : Monto pagado y acreditado en la CIC correspondiente al mes de devengue k. Tasa SPPk : Tasa de aporte del SPP vigente en el mes de devengue k. Incluye, en los casos que corresponda, la tasa de aporte complementario del trabajador y del empleador de la Ley N° 27252 y su reglamento, aprobado por Decreto Supremo Nº 164-2001-EF y sus modificatorias. Tasa SNPk : Tasa de aporte del SNP vigente en el mes de devengue k. RAMk : Remuneración (ingreso) asegurable mensual correspondiente al mes de devengue k. Si el afiliado percibe más de una remuneración en dicho mes, se considera la suma de todas ellas. RMVk : Remuneración Mínima Vital vigente en el mes de devengue k. l : Empleador o empresa. p : Número de empleadores o empresas para un mismo mes de devengue k. UdA SPPl,k : UdA del SPP correspondiente al empleador o empresa l para el mes de devengue k. Aportel,k : Monto pagado y acreditado en la CIC correspondiente al mes de devengue k y al empleador o empresa l. Tasa SPPl,k : Tasa de aporte del SPP vigente en el mes de devengue k, correspondiente al empleador o empresa l. Incluye, en los casos que corresponda, la tasa de aporte complementario del trabajador y del empleador de la Ley N° 27252 y su reglamento, aprobado por Decreto Supremo Nº 164-2001-EF y sus modificatorias. RAMl,k : Remuneración (ingreso) asegurable mensual correspondiente al mes de devengue k y al empleador o empresa l. ǡ  : UdA equivalente correspondiente al empleador o empresa l para el mes de devengue k. i : Retiro realizado por el afiliado, que puede tomar valores desde 1 hasta m. m : Número de retiros realizados por el afiliado. i : Coeficiente de retención, sirve para la cuantificación de la UdA que permanecen en la CIC luego del retiro i. ǡ  : UdAs equivalentes generadas en el periodo transcurrido entre la afiliación y el primer retiro. ǡ  : UdAs equivalentes generadas en el periodo transcurrido entre el retiro 1 y retiro 2. ǡ  : UdAs equivalentes generadas en el periodo transcurrido entre el retiro m-1 y retiro m. ǡ  : UdAs equivalentes generadas en el periodo transcurrido entre el último retiro m y la fecha de traslado al SNP. ri : Monto sustraído de la CIC por el retiro i.   : CIC del afiliado al momento del retiro i. n1 : Número de meses transcurridos entre la afiliación y el primer retiro. n2 : Número de meses transcurridos entre el primer y segundo retiro. nm : Número de meses transcurridos entre el último retiro m y el penúltimo retiro m-1. nt : Número de meses transcurridos entre el último retiro m y la fecha de traslado t. Si con posterioridad de la incorporación del BdR a la CIC se efectúan retiros de fondos, la EAF debe informar las UdAs efectivas del BdR. Para tal efecto, aplica el coeficiente de retención sobre las UdAs correspondientes a los períodos de aportes reconocidos en la respectiva resolución del BdR, conforme se establece a continuación:  \u0003\u0003Ⱦ   Notación  : UdAs efectivas del BdR  : UdAs del BdR Si el valor del BdR no se encuentra incorporado en la CIC a la fecha del retiro, la EAF contabiliza como UdAs, las UdAs por el periodo de aportes reconocido en la resolución de BdR consentida, en adición a las UdAs efectivas por aportes al SPP. En el caso que el afiliado cuente con resolución de otorgamiento de BdR, y no se haya producido retiros con posterioridad a su redención, la EAF contabiliza las UdAs por el periodo de aportes reconocido en la resolución de BdR consentida, en adición a las UdAs efectivas equivalentes en el SPP."], "ROT 20": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 20", "Artículo 20.- Registro de la información de la solicitud de traslado del SPP al SNP en la PAST 20.1 El registro de la información de las solicitudes en la PAST es realizado por la EAF debidamente autenticada, conforme a los mecanismos de seguridad e identificación establecidos en la PAST, y que permitan generar interoperabilidad e interconexión.<br>20.2. La EAF realiza el registro individual o masivo de la información de las solicitudes en la PAST, utilizando la estructura de datos del formato del Anexo N° 04.<br>a) La PAST realiza validaciones automáticas destinadas a verificar la identidad, supervivencia del afiliado y el cumplimiento del periodo mínimo de permanencia en el régimen previsional de origen, para la continuación del trámite.<br>b) Como resultado de las validaciones, si se determina que alguna solicitud recibida por la EAF no cumple con las condiciones para el traslado o presenta errores en su registro, la PAST informa los motivos del incumplimiento, sin generar el registro del trámite, ni afectar el tratamiento de la información de las demás solicitudes registradas, de corresponder.<br>20.3. La EAF realiza la carga de la información del RESIT-SPP en la PAST, en consideración de la estructura de datos del formato del Anexo N° 03.<br>a) La PAST realiza validaciones automáticas destinadas a verificar la consistencia u omisiones del RESIT- SPP.<br>b) Como resultado de las validaciones, si se determina que el RESIT-SPP presenta inconsistencias u omisiones en la información, la PAST informa las observaciones detectadas para su subsanación y continuidad del trámite de la solicitud.<br>20.4. El plazo para la carga simultánea, progresiva o subsanación de la información a los que se refieren los numerales 20.2 y 20.3 es de ocho (8) días hábiles, contados a partir de la fecha de presentación de la solicitud del afiliado ante la EAF.<br>20.5. La PAST confirma el registro de la información de las solicitudes a la EAF para su constancia y seguimiento.<br>20.6. La EAF comunica al afiliado el envío de la información a la ONP a través de la PAST, como parte del proceso de traslado, para su conocimiento, constancia y seguimiento del trámite."], "ROT 21": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 21", "Artículo 21.- Reconocimiento y equivalencia de UdAs 21.1 La ONP verifica y valida la equivalencia de UdAs remitida por la EAF y, de corresponder, procede a su reconocimiento y registro en la historia previsional del afiliado. 21.2 Como resultado del procedimiento de reconocimiento y equivalencia, la ONP genera el RESIT-SNP, el cual contiene el detalle de las UdAs reconocidas en el SNP y el SPP, así como la información previsional correspondiente. 21.3 La ONP remite mediante la PAST a la EAF el RESIT-SNP en un plazo máximo de treinta (30) días hábiles contados desde la recepción del RESIT-SPP."], "ROT 23": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 23", "Artículo 23.- Emisión de la constancia de traslado y afiliación al SNP 23.1 La SBS, el mismo día en que la EAF registra la conformidad del afiliado en la PAST, debe:<br>a) Emitir la constancia de traslado y remitir la información de la misma a la EAF y a la ONP a través de los mecanismos habilitados para tal efecto.<br>b) Ejecutar la baja del afiliado en el SPP al culminar el día de la emisión de la constancia de traslado. 23.2 La ONP con la información disponible en la PAST incorpora al afiliado al SNP, al día siguiente calendario de emitida la constancia de traslado, a partir de lo cual el nuevo estado en el SIPP queda actualizado. 23.3 La EAF en un plazo máximo de cinco (5) días hábiles de recibida la constancia de traslado, comunica al afiliado mediante los mecanismos habilitados para tal efecto."], "ROT 24": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 24", "Artículo 24.- Transferencia del saldo de la CIC y constancia de transferencia 24.1 Emitida la constancia de traslado del SPP al SNP, la EAF debe efectuar la transferencia del cien por ciento (100 %) del saldo acumulado de la Cuenta Individual de Capitalización (CIC) correspondiente a los aportes obligatorios, a favor del Fondo Consolidado de Reservas Previsionales – Fondo FCR del Decreto Ley N° 19990.<br>24.2. Recibida la constancia de traslado, la EAF remite a la ONP, a través de la PAST, la información para la transferencia de la CIC en un plazo máximo de cinco (5) días hábiles, en consideración del formato del Anexo N° 05 (APT – SPP), para lo cual previamente debe cerrar la CIC y transferir los recursos a una cuenta por pagar, conforme a las disposiciones que emita la SBS para dicho fin. Para ello:<br>a) La ONP valida la consistencia de la información remitida por la EAF dentro del plazo máximo de un (1) día hábil, de haberla recibido.<br>b) En caso se identifiquen observaciones, la ONP devuelve la información a la EAF para su revisión y subsanación, de corresponder.<br>24.3. Validada la información, la ONP comunica a la EAF a través de la PAST, que el monto se encuentra habilitado para la transferencia mediante las entidades bancarias correspondientes.<br>24.4. Recibida la conformidad de la ONP para la transferencia, la EAF cuenta con un plazo máximo de quince (15) días calendario para realizar la transferencia de la CIC.<br>24.5. La EAF emite y comunica la constancia de la transferencia de la CIC al afiliado y a la ONP, conforme con las disposiciones normativas que emita la SBS.<br>24.6. Efectuada la transferencia de los recursos por la EAF y verificado el monto efectivamente depositado, la ONP emite las Constancias de Transferencia del saldo de la CIC y las registra en la PAST mensualmente.<br>24.7. La Constancia de Transferencia del saldo de la CIC acredita la transferencia de los recursos derivados del traslado y contiene, como mínimo, la información relativa al monto transferido de la CIC, las Unidades de Aporte (UdAs) reconocidas y, cuando corresponda, el valor del Bono de Reconocimiento, así como la información referida a los aportes voluntarios con fines previsionales.<br>24.8. La Constancia de Transferencia del saldo de la CIC se pone a disposición de la EAF a través de la PAST y se comunica al afiliado mediante los medios de contacto que este tenga registrados o haya dispuesto.<br>24.9. El saldo acumulado en la CIC proveniente de aportes voluntarios con fin previsional no es objeto de transferencia al FCR-SPP y permanece bajo administración de la EAF hasta el momento de la jubilación del afiliado, conforme a la normativa vigente."], "ROT 25": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 25", "Artículo 25.- Aportes recuperados posterior a la transferencia de traslado.<br>25.1. Los aportes identificados o recuperados por las EAF, incluidos los intereses moratorios, posteriores al cierre de la cuenta, son transferidos a la ONP en consideración del formato del Anexo N° 05 (APT – SPP), donde se consigna el estado de aporte con el código 2 (identificados o recuperados). La transferencia debe efectuarse dentro del mes siguiente a aquel en que los aportes fueron identificados o recuperados, siempre que el afiliado permanezca incorporado al SNP al momento de realizarse dicha transferencia.<br>25.2. Para dicho efecto, previamente la EAF determina las UdAs efectivas equivalentes, elabora el archivo de transferencia conforme con el Anexo N° 05 (APT – SPP) para remitirlo a la ONP a través de los mecanismos de comunicación habilitados para tal efecto.<br>25.3. Los aportes identificados o recuperados con posterioridad al traslado son acreditados por la ONP mediante los mecanismos que para tal fin disponga."], "Reg 101": ["Reglamento · D.S. N° 189-2025-EF · art. 101", "Artículo 101. Pago del Beneficio Complementario 101.1. Corresponde percibir el beneficio complementario a partir del mes de enero del año fiscal siguiente al inicio de la recaudación del aporte. La ONP comunica mediante cronograma el inicio y las fechas del pago mensual del beneficio complementario.<br>101.2. En los casos que, a través de pronunciamientos administrativos o judiciales firmes se reconozca el beneficio complementario o la regularización del monto del beneficio de periodos cuyo fondo se hayan cancelado, la ONP atiende la obligación del pago con cargo al fondo del ejercicio fiscal que se viene recaudando y conforme lo establece la Ley N° 30137, Ley que establece criterios de priorización para la atención del pago de sentencias judiciales y modificatorias. Para la determinación del importe, se mantendrá el factor de reparto determinado en cada ejercicio cancelado.<br>101.3. El monto anual del beneficio es programado en 12 pagos mensuales en el año. Con el primer pago mensual programado en el año, se reintegra los meses que no se hubieran efectuado el pago.<br>101.4. En atención a que la determinación del monto del FCJTP se realiza por cada ejercicio fiscal, la distribución del Beneficio Complementario entre los beneficiarios tiene efecto cancelatorio.<br>101.5. De resultar insuficientes los recursos del fondo, el pago se realiza de manera proporcional al beneficio complementario de cada beneficiario según los recursos acumulados en el fondo por cada ejercicio fiscal, sin generarse deuda por el diferencial que resulte del importe íntegro del beneficio complementario.<br>101.6. En caso quede saldo de los recursos del fondo, estos se toman en cuenta para el siguiente ejercicio fiscal.<br>101.7. La ONP atiende el pago derivado de pronunciamientos administrativos o judiciales firmes que reconozcan el beneficio complementario o regularicen el monto del mismo beneficio complementario con los recursos disponibles del ejercicio fiscal que se viene recaudando y conforme lo establece la Ley N° 30137 y modificatorias, considerando el mismo factor de distribución proporcional utilizado en cada ejercicio cancelado, de corresponder.<br>101.8. Las EAF son responsables de remitir a la ONP la información vigente y correcta de sus pensionistas para el cálculo del beneficio complementario, en el caso de omisión o envío incorrecto de la información, la regularización del pago del beneficio complementario es asumida por la EAF de manera directa con el afiliado."], "Reg 104": ["Reglamento · D.S. N° 189-2025-EF · art. 104", "Artículo 104. Asignación de recursos públicos al Sistema 104.1. El MEF realiza anualmente asignación de recursos a la ONP, considerando los principios de sostenibilidad fiscal y equilibrio presupuestario, garantizando la cobertura progresiva de las prestaciones no contributivas. 104.2. Los aportes voluntarios con fin previsional cubiertos con recursos del Tesoro Público son aprobados en la Ley de Presupuesto para cada año fiscal."], "Reg 109": ["Reglamento · D.S. N° 189-2025-EF · art. 109", "Artículo 109. Financiamiento de las prestaciones semicontributivas 109.1. Las pensiones del pilar semicontributivo otorgado a los afiliados del SNP se financian con las fuentes de recursos establecidos para este régimen previsional. 109.2. Las prestaciones semicontributivas a los afiliados del SPP son financiadas con recursos del Fondo FCR-SPP, completados con transferencias de recursos públicos, destinado a cubrir la insuficiencia de recursos necesarios para el pago de la planilla de pensiones."], "Reg 110": ["Reglamento · D.S. N° 189-2025-EF · art. 110", "Artículo 110. Financiamiento de las prestaciones no contributivas 110.1. Las PNC se financian con:<br>a. Recursos ordinarios del Tesoro Público.<br>b. Saldos existentes en la CIC de las personas afiliadas al SPP que acceden a una PNC, de corresponder. 110.2. Los programas sociales realizan anualmente una proyección del crecimiento de la población objetivo para su presentación y evaluación, la cual es remitida a la ONP a más tardar el último día hábil de cada mes de marzo del año anterior, con la finalidad de que la ONP gestiona ante el MEF la asignación presupuestal necesaria para ejecutar el pago de la PNC, de acuerdo con la capacidad financiera del Estado. CAPÍTULO III FONDOS ADMINISTRADOS POR EL FONDO CONSOLIDADO DE RESERVAS PREVISIONALES- FCR"], "Reg 111.1": ["Reglamento · D.S. N° 189-2025-EF · art. 111.1", "111.1. De acuerdo al artículo 12 de la Constitución, los fondos del FCR, como fondos de seguridad social en pensiones, son intangibles, no pudiendo ser donados, embargados, rematados, dados en garantía o destinados para otro fin que no sea de carácter previsional."], "Reg 112": ["Reglamento · D.S. N° 189-2025-EF · art. 112", "Artículo 112. Fondos administrados por el FCR El FCR tiene a su cargo distintos fondos, mediante la inversión adecuada, directamente o a través de contratos con entidades de reconocido prestigio. En el marco de la Ley el FCR administra estos fondos, en adición a los que ya se encuentran bajo su administración.<br>a) Fondos transferidos del SPP para el pago de pensiones semicontributivas (FCR-SPP): son recursos transferidos por la EAF al FCR, para el financiamiento colectivo de la planilla de pensiones de los afiliados del SPP que acceden a prestaciones del pilar semicontributivo. Estos recursos son intangibles y solo deben emplearse para el pago de los beneficios con garantía estatal a los afiliados del SPP. Los recursos de este fondo se integran en un fondo común y de reparto.<br>b) Fondo para prestaciones no contributivas (FCR-PNC): son recursos transferidos por la EAF al FCR provenientes de la CIC de los afiliados al SPP que accedan a prestaciones del pilar no contributivo. Estos recursos son intangibles y solo deben emplearse para el pago de pensiones no contributivas. Los recursos de este fondo se integran en un fondo común y de reparto."], "Reg 117": ["Reglamento · D.S. N° 189-2025-EF · art. 117", "Artículo 117. Funciones del Ministerio de Economía y Finanzas para el monitoreo y control de las obligaciones previsionales Para el monitoreo y control de las obligaciones previsionales, el MEF desarrolla las siguientes funciones:<br>a. Registro y Control: realizar anualmente el registro y control de las obligaciones previsionales a cargo del Estado, con el fin de asegurar el cumplimiento de las responsabilidades financieras del Estado en materia de pensiones.<br>b. Evaluación y seguimiento: realizar la evaluación y seguimiento del desempeño del sistema de pensiones.<br>c. Salud Financiera: velar por la salud financiera de los sistemas previsionales contributivos, promoviendo medidas para garantizar su sostenibilidad y estabilidad a largo plazo."], "Reg 118.1": ["Reglamento · D.S. N° 189-2025-EF · art. 118.1", "118.1. Anualmente la ONP y la SBS remiten al MEF información del SNP y SPP respectivamente, la ONP debe presentar la información en los formatos que se le requiera para ese objeto. La SBS suscribe convenios con el MEF, a efectos de presentar la información que forme parte en lo concerniente al ámbito previsional. La información a la que se acceda tiene carácter confidencial y constituye parte de los datos protegidos por la Ley Nº 29733."], "Reg 13.2": ["Reglamento · D.S. N° 189-2025-EF · art. 13.2", "13.2. La ONP y la SBS comparten la gobernanza de los procesos a cargo de la PAST. Para ello, la ONP en coordinación con la SBS, aprueba los lineamientos sobre estructura, adaptabilidad, mejoras y gestión de los procesos que a esta se le encarguen."], "Reg 13.3": ["Reglamento · D.S. N° 189-2025-EF · art. 13.3", "13.3. La creación y la operatividad de la PAST están a cargo de la ONP, para lo cual el RENIEC y MIGRACIONES proporcionan la información de identificación y datos de contacto, de corresponder, de los ciudadanos y extranjeros en el Sistema. Para este fin debe priorizarse la interoperabilidad de las entidades señaladas, conforme el marco regulatorio vigente en materia de gobierno y transformación digital."], "Reg 14.1": ["Reglamento · D.S. N° 189-2025-EF · art. 14.1", "14.1. Para el adecuado cumplimiento del proceso de elección y afiliación al Sistema, a través de la PAST, corresponde al RENIEC brindar a la ONP la información siguiente:<br>a. Remite trimestralmente, los datos de las personas que van a cumplir dieciocho (18) años en el trimestre siguiente, complementando esta información con el correo electrónico en el trimestre subsiguiente (en caso de que se cuente con la autorización del titular).<br>b. Remite, por única vez, en los plazos que para ello se determine, la información de las personas mayores de dieciocho (18) años que no estén afiliados al Sistema o algún régimen previsional existente a la fecha de entrada en vigor de la Ley.<br>c. Para el cumplimiento del acápite anterior, la ONP remite, previamente al RENIEC, la información actualizada de las personas que debe excluir por ser pensionistas o estar afiliados al Sistema o algún régimen previsional existente.<br>d. La información del RENIEC señalada en literales a y b del presente numeral, debe incluir los datos de identificación de la persona (tipo y número de documento de identidad, apellido paterno, apellido materno, nombres), fecha de nacimiento, dirección, ubigeo de la dirección y correo electrónico (en caso de que se cuente con la autorización del titular)."], "Reg 15.1": ["Reglamento · D.S. N° 189-2025-EF · art. 15.1", "15.1. L a ONP es la entidad responsable de gestionar la PAST para el proceso de elección de las personas entre el SNP y el SPP."], "Reg 15.2": ["Reglamento · D.S. N° 189-2025-EF · art. 15.2", "15.2. Para la elección y afiliación al SNP o al SPP deben cumplirse las siguientes condiciones:<br>a. Elección del régimen: La persona al momento de la elección del régimen previsional completa el formulario de elección que se pone a disposición a través de la PAST, de acuerdo con las condiciones exigidas para cada tipo de afiliación y a través de los canales que se hayan dispuesto para tal fin. El formulario de elección contiene por lo menos lo siguiente: 1. Nombre: Es la consignación de los nombres y apellidos completos de la persona, tal como figura en el documento de identificación. 2. Número de identificación: Puede ser:<br>i. El del Documento Nacional de Identidad (DNI), para los nacionales.<br>ii. El del Carné de extranjería, pasaporte o cualquier documento de identidad permitido bajo las normas migratorias vigentes, en caso de los extranjeros.<br>iii. En caso de no contar con los anteriores documentos, cualquier otro que permita su identificación de manera fehaciente, conforme a las disposiciones de la materia y los lineamientos que disponga la ONP. 3. Régimen elegido: La persona señala su elección por el SNP o el SPP.<br>b. Evaluación e interacción inicial: Recibido el formulario, la ONP confirma, de preferencia en línea, los datos indicados por la persona, verificando la validez de estos. Si hubiese duda por alguno de ellos, la ONP puede realizar observaciones y requerir a la persona el levantamiento de estas y/o las correcciones respectivas.<br>c. Información de contacto: Estos datos se proporcionan al momento de la afiliación de manera obligatoria, como apellidos y nombres, correo electrónico, teléfono móvil o teléfono fijo, cuando lo posea. La ONP puede determinar otra información que resulte pertinente.<br>d. Comunicación final: El resultado final del proceso de afiliación es comunicado por la ONP o la EAF al nuevo afiliado al Sistema, según corresponda."], "Reg 16.1": ["Reglamento · D.S. N° 189-2025-EF · art. 16.1", "16.1. La FAS contiene la información de los afiliados del Sistema, bajo las siguientes reglas:<br>a. Accesibilidad: Los afiliados tienen acceso permanente a la FAS, en las plataformas que las EAF o la ONP, pongan a disposición de sus afiliados.<br>b. Modificabilidad: La FAS no es un documento rígido, sino que está en constante actualización con información de RENIEC, MIGRACIONES, SUNAT y otras bases de datos oficiales, brindando las EAF y la ONP todas las facilidades posibles al afiliado, conforme a lo siguiente: 1. De parte del afiliado: Siempre que se produzca variación de los campos en la FAS, el afiliado debe realizar la actualización. 2. De parte de las EAF y la ONP: Realiza la constante actualización respecto de los datos que cada régimen administra. Las EAF acceden a información de la SUNAT que no está protegida por la reserva tributaria"], "Reg 18.2": ["Reglamento · D.S. N° 189-2025-EF · art. 18.2", "18.2. El plazo para la elección de afiliación vence antes de cumplirse doce (12) meses contados a partir del día siguiente de cumplida la mayoría de edad. En caso la persona no elija en el plazo indicado queda automáticamente afiliado al SNP."], "Reg 19.3": ["Reglamento · D.S. N° 189-2025-EF · art. 19.3", "19.3. A partir del 1 de junio de 2028 y en caso de no haber elegido entre el SPP y el SNP, el ciudadano queda automáticamente afiliado al SPP y se sujetan a la licitación del servicio de administración de la CIC dispuesto en el artículo 7-A del TUO de la Ley del SPP."], "Reg 25.2": ["Reglamento · D.S. N° 189-2025-EF · art. 25.2", "25.2. Las EAF administran los aportes voluntarios del Sistema. SUBCAPÍTULO II APORTE OBLIGATORIO"], "Reg 31": ["Reglamento · D.S. N° 189-2025-EF · art. 31", "Artículo 31. Aporte voluntario con fin previsional 31.1. El aporte voluntario con fin previsional es el que realiza el afiliado de forma libre y extraordinaria con la finalidad de complementar los aportes requeridos para el acceso a pensiones semicontributivas o incrementar el monto que reciba al obtener una prestación dentro del pilar contributivo. 31.2. El aporte voluntario con fin previsional forma parte del Pilar Voluntario y puede ser de los siguientes tipos:<br>a. Aporte por transferencia directa del afiliado, siempre y cuando haya realizado un aporte obligatorio en el mes.<br>b. Aporte a través de la devolución por pagos en exceso del impuesto a la renta.<br>c. Aporte del Estado sustentado en los gastos por consumo.<br>d. Aporte del Estado para el incentivo al ahorro.<br>e. Aporte del Empleador. 31.3. El procedimiento para realizar el aporte voluntario con fin previsional se realiza conforme a las normas del SPP y las normas complementarias que, en el marco de sus competencias, dicte la SBS para ello, en coordinación con la ONP. 31.4. Los aportes voluntarios con fin previsional de los afiliados al SPP, se rigen bajo las normas del TUO de la Ley del SPP, reglamento y normas complementarias. 31.5. En el caso de los aportes con fin previsional con financiamiento del Estado, se rigen bajo las disposiciones específicas que se dicten para ello en el presente reglamento."], "Reg 34.1": ["Reglamento · D.S. N° 189-2025-EF · art. 34.1", "34.1. La determinación, retención, declaración y pago del aporte obligatorio al SNP de los trabajadores dependientes se regula según las normas tributarias."], "Reg 34.2": ["Reglamento · D.S. N° 189-2025-EF · art. 34.2", "34.2. El pago de los aportes obligatorios de los afiliados del SPP se realiza de conformidad con lo establecido en el TUO de la Ley del SPP, donde el empleador retiene el importe del aporte previsional al afiliado y realiza la declaración y pago a la entidad centralizadora establecida. El pago puede ser hecho a través de la institución financiera o de otra naturaleza que designe la entidad centralizadora mencionada."], "Reg 41.2": ["Reglamento · D.S. N° 189-2025-EF · art. 41.2", "41.2. En el caso del SPP, las EAF son responsables de realizar y continuar con la ejecución de las acciones de cobranza sobre los aportes retenidos y no pagados en el SPP, para los afiliados que se trasladen al SNP, o soliciten beneficios con garantía estatal, debiendo trasladar los montos recuperados al fondo del FCR-Decreto Ley N° 19990 o al FCR-SPP respectivamente."], "Reg 49.1": ["Reglamento · D.S. N° 189-2025-EF · art. 49.1", "49.1. El afiliado al SNP inicia su trámite de traslado ante la ONP a través de la PAST, para ser incorporado como afiliado de la EAF ganadora de la licitación vigente en el SPP. El traslado se acredita mediante la constancia de traslado que emite la ONP."], "Reg 49.2": ["Reglamento · D.S. N° 189-2025-EF · art. 49.2", "49.2. Corresponde a la ONP revisar y evaluar las condiciones del traslado, verificando las UdAs efectivas, en el plazo que se establezca en el reglamento operativo."], "Reg 50.1": ["Reglamento · D.S. N° 189-2025-EF · art. 50.1", "50.1. El afiliado al SPP inicia su trámite de traslado ante la EAF, que a su vez debe ingresar la solicitud a la PAST, utilizando el formulario de traslado implementado para tal fin."], "Reg 50.2": ["Reglamento · D.S. N° 189-2025-EF · art. 50.2", "50.2. La EAF en el plazo que establezca el reglamento operativo, remite a la ONP el Reporte Situacional del afiliado al SPP, el cual contiene la siguiente información:<br>a. Número de UdA acumuladas durante la permanencia del afiliado en el SPP, calculada según la fórmula establecida en el numeral 44.1 del artículo 44 del presente reglamento.<br>b. Condición laboral, de ser el caso<br>c. Monto de la pensión estimada o calculada.<br>d. Datos generales del afiliado.<br>e. Datos generales de los empleadores.<br>f. Saldo de la CIC.<br>g. Información de aportes en cobranza<br>h. Historial de aportaciones al SPP donde se consigna el monto del aporte, tipo de aporte, mes de devengue, fecha de pago."], "Reg 51.1": ["Reglamento · D.S. N° 189-2025-EF · art. 51.1", "51.1. L a EAF realiza la transferencia del 100% del saldo acumulado en la CIC de aportes obligatorios al FCR-Decreto Ley N° 19990, y emite una constancia de traslado que valida dicha acción."], "Reg 58.1": ["Reglamento · D.S. N° 189-2025-EF · art. 58.1", "58.1. Los afiliados al SNP presentan su solicitud de pensión a través de los canales que
