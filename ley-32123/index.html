const ART={"DS061 20": ["D.S. N° 061-2026-EF · nuevo texto del Reglamento · art. 20", "Artículo 20. Regla especial por inicio de actividad laboral<br>20.1 Toda persona que no se encuentre afiliada a un régimen previsional, o que se encuentre dentro del plazo de elección para afiliarse al Sistema, y que inicie una relación laboral de dependencia debe afiliarse al Sistema y elegir entre el SNP o el SPP hasta diez (10) días calendario siguientes de iniciado su vínculo laboral. El trabajador debe entregar a su empleador una copia física o electrónica de su constancia de afiliación, en caso de que no se pueda verificar su condición de afiliación al SNP o SPP, a fin de que el empleador pueda realizar la retención y pago de su aporte previsional al régimen correspondiente.<br>20.2 Es obligación del empleador, verificar en la PAST la condición de afiliado al Sistema de su trabajador. En caso de no ser posible dicha verificación, el empleador está obligado a solicitar la constancia de afiliación del trabajador al Sistema. (...)”."], "L32445 1": ["Ley N° 32445 · art. 1", "Artículo 1. Objeto de la Ley La presente ley tiene por objeto autorizar de manera extraordinaria y facultativa a todos los afiliados al Sistema Privado de Administración de Fondos de Pensiones, sin ninguna excepción, el retiro de los fondos acumulados en sus cuentas individuales de capitalización, hasta por el monto de cuatro unidades impositivas tributarias (4 UIT)."], "L32445 2": ["Ley N° 32445 · art. 2", "Artículo 2. Procedimiento de solicitud de retiro El procedimiento para el retiro extraordinario y facultativo de los fondos pensionarios es el siguiente:<br>a) Los afiliados presentan su solicitud de manera física o virtual dentro de los noventa días calendario posteriores a la vigencia del reglamento de la presente ley.<br>b) Se abona un monto de hasta una unidad impositiva tributaria (1 UIT) cada treinta días calendario. El primer desembolso se realiza a los treinta días calendario de presentada la solicitud ante la administradora privada de fondos de pensiones a la que pertenezca el afiliado.<br>c) En el caso de que el afiliado desista de continuar retirando los fondos de su cuenta individual de capitalización, puede solicitarlo por única vez a la administradora privada de fondos de pensiones diez días calendario antes del siguiente desembolso."], "L32445 4": ["Ley N° 32445 · art. 4", "Artículo 4. Apertura de cuentas en el sistema financiero 4.1. Las empresas del sistema financiero, incluido el Banco de la Nación, y las empresas emisoras de dinero electrónico pueden abrir cuentas, masiva o individualmente, a nombre de beneficiarios identificados por las administradoras privadas de fondos de pensiones (AFP) que instruyen los pagos, sin necesidad de la celebración previa de un contrato ni de la aceptación por parte del titular de la cuenta. 4.2. Las empresas del sistema financiero y las empresas emisoras de dinero electrónico pueden compartir con las AFP que instruyen los pagos información de identificación de la cuenta o cuentas preexistentes de los beneficiarios, incluyendo el Código de Cuenta Interbancario (CCI), lo cual está exceptuado del alcance del secreto bancario. Las AFP que instruyen los pagos pueden compartir los datos personales de los beneficiarios que resulten estrictamente necesarios para el propósito descrito en el párrafo 4.1., lo cual se considera dentro de lo dispuesto en el numeral 9 del artículo 14 de la Ley 29733, Ley de Protección de Datos Personales, únicamente con la finalidad de efectuar la transferencia de fondos. 4.3. Las cuentas a las que se hace referencia en el párrafo 4.1. pueden ser utilizadas por el titular para fines adicionales al depósito y retiro de los fondos transferidos. También pueden ser cerradas por las empresas del …"], "Ley 10.1": ["Ley N° 32123 · art. 10.1", "10.1. Para la recuperación de aportes del SNP, la Sunat aplica los procedimientos tributarios establecidos para recuperar los aportes adeudados, tanto de forma voluntaria como coactiva, conforme lo dispone el Código Tributario. Asimismo, en caso de que el agente de retención no cumpla con la obligación de retener los aportes, se aplica lo señalado en el numeral 2 del artículo 18 del Código Tributario."], "Ley 14.1": ["Ley N° 32123 · art. 14.1", "14.1. El SNP es un régimen de repartos. La ONP se encuentra a cargo de su administración."], "Ley 14.2": ["Ley N° 32123 · art. 14.2", "14.2. El SPP es un régimen de capitalización individual que es administrado por:<br>a) Las administradoras de fondos de pensiones (AFP) y las empresas del sistema financiero (ESF) establecidas en los literales a),<br>c) y<br>d) del artículo 16 de la Ley 26702, Ley General del Sistema Financiero y del Sistema de Seguros y Orgánica de la Superintendencia de Banca y Seguros, en igualdad de condiciones de competencia y bajo las disposiciones y salvaguardas establecidas en el TUO de la Ley del Sistema Privado de Pensiones y normas complementarias, y que se acogen a todas las obligaciones, responsabilidades y derechos que establece dicho TUO."], "Ley 16.1": ["Ley N° 32123 · art. 16.1", "16.1. Dentro del pilar contributivo, tanto el SNP como el SPP llevan a cabo sus procesos para recabar los aportes previsionales, bajo las plataformas que cada uno de ellos les provea, incluidas las entidades centralizadoras, según la regulación aplicable."], "Ley 16.2": ["Ley N° 32123 · art. 16.2", "16.2. Los pagos de los aportes al Sistema, sean obligatorios o voluntarios, son realizados mediante aplicativo móvil, billetera móvil, agentes bancarios u otros mecanismos innovadores conforme se establezca en las normas reglamentarias. CAPÍTULO IV PILARES SUBCAPÍTULO I PILAR NO CONTRIBUTIVO"], "Ley 17": ["Ley N° 32123 · art. 17", "Artículo 17. Administración La ONP es responsable de administrar el pago y articular el pilar no contributivo de forma progresiva, el que se financia con recursos del tesoro público tales como un porcentaje de los saldos anuales de balance y otros recursos que el Estado considere."], "Ley 20": ["Ley N° 32123 · art. 20", "Artículo 20. Registro informático Todo perceptor de una pensión no contributiva es registrado en el Aplicativo Informático para el Registro Centralizado de Planillas y de Datos de los Recursos Humanos del Sector Público (AIRHSP). SUBCAPÍTULO II PILAR SEMICONTRIBUTIVO"], "Ley 24": ["Ley N° 32123 · art. 24", "Artículo 24. Financiamiento Las pensiones del pilar semicontributivo se financian de acuerdo con lo siguiente:<br>a) En el SNP, el financiamiento se realiza a través de las fuentes establecidas según la normativa vigente.<br>b) En el SPP, el financiamiento proviene de los recursos de la CIC de cada afiliado y con el producto de la redención del bono de reconocimiento, de ser el caso, los cuales se complementan con recursos públicos."], "Ley 30": ["Ley N° 32123 · art. 30", "Artículo 30. Pago de las prestaciones El pago de las prestaciones que otorga este pilar está a cargo de:<br>a) La ONP, para el caso del SNP y los regímenes que tiene a cargo.<br>b) Las entidades mencionadas en el párrafo 14.2 del artículo 14, para el caso del SPP y los regímenes que lo componen; así como por las empresas de seguros, cuando intervengan directamente en el pago de una pensión de jubilación, invalidez, sobrevivencia y gastos de sepelio.<br>c) No hay incompatibilidad para la percepción de prestaciones contributivas, que cubran o no el mismo riesgo, en el Sistema."], "Ley 35": ["Ley N° 32123 · art. 35", "Artículo 35. Pensión por consumo 35.1. Se crea el aporte por consumo, que es un aporte complementario de naturaleza previsional, proveniente de los gastos por consumo realizados por los afiliados al Sistema, debidamente sustentados en boletas de venta electrónicas que contengan el o los nombres y apellidos de la persona natural y su número de documento nacional de identidad (DNI) correspondiente, y siempre que se cumpla con lo previsto en el presente artículo y en el párrafo 36.1 del artículo 36 de la presente ley. El aporte por consumo se financia con recursos del tesoro público consignados y autorizados en el presupuesto público de cada año. 35.2. El aporte por consumo es intangible e inembargable, no puede ser destinado para otro fin que no sea de carácter previsional y se mantiene en la cuenta del afiliado al Sistema hasta su jubilación. 35.3. El aporte por consumo es administrado por el SPP, a través de una cuenta especial, que puede estar sujeta al pago de una comisión. Las características, funcionamiento, mecanismos de aportación, entre otros, son establecidas en los reglamentos correspondientes. 35.4. Las EAF crean la cuenta especial de sus afiliados, y en el caso de los afiliados al SNP, estos solicitan su creación en la EAF de su elección, conforme al proceso que la SBS establezca para ello. 35.5. El aporte por consumo cesa cuando el afiliado accede a una prestación p…"], "Ley 41": ["Ley N° 32123 · art. 41", "Artículo 41. Administración del Fondo Complementario de Jubilación para Trabajadores Pesqueros 41.1 Los recursos del FCJTP son administrados por el FCR, contabilizándose en forma independiente de los demás recursos a su cargo. 41.2 La administración de los recursos se rige por los lineamientos que para tal efecto establezca el Directorio del FCR. 41.3 La Sunat transfiere el monto recaudado por dicho aporte al FCR, luego de deducir la comisión respectiva en favor de la Sunat y la comisión para atender el gasto de administración del beneficio complementario en que incurra la ONP, calculada esta última en el equivalente al tope del porcentaje previsto en el inciso a. del numeral 3 del artículo 12 del Reglamento de la Ley 28532, aprobado por el Decreto Supremo 118-2006-EF, aplicado sobre la suma de la recaudación."], "Ley 42": ["Ley N° 32123 · art. 42", "Artículo 42. Administración del beneficio complementario La administración del beneficio complementario del FCJTP se encuentra a cargo de la ONP. En el caso de los pensionistas del SPP, las AFP deben remitir a la ONP la información necesaria para el cálculo del beneficio complementario. DISPOSICIONES COMPLEMENTARIAS FINALES PRIMERA. Reglamentación Mediante decreto supremo, refrendado por el ministro de Economía y Finanzas, se aprueba el reglamento, para la adecuada aplicación e implementación de la presente ley, en un plazo no mayor a ciento ochenta (180) días hábiles contados a partir del día siguiente de su publicación en el diario oficial El Peruano. SEGUNDA. Vigencia La presente ley entra en vigencia al día siguiente de la publicación de su reglamento en el diario oficial El Peruano, conforme con lo dispuesto en la primera disposición complementaria final, salvo los artículos y disposiciones que se indican a continuación:<br>a) El artículo 8 entra en vigor después de dos años de aprobada la presente ley, conforme a lo dispuesto en el 8.2 del mismo.<br>b) La quinta disposición complementaria transitoria entra en vigencia a partir del mes de enero del siguiente año que se apruebe la ley.<br>c) La primera disposición complementaria final, entra en vigencia al día siguiente de la publicación de la presente norma en el diario oficial El Peruano.<br>d) Las responsabilidades asumi…"], "Ley 8.1": ["Ley N° 32123 · art. 8.1", "8.1. Las aportaciones obligatorias de los afiliados al SNP no pueden ser inferiores al 13 % de la remuneración mensual asegurable o pensionable a cargo del afiliado, sin perjuicio de los aportes que legalmente corresponde realizar al empleador o al Estado."], "Ley 8.2": ["Ley N° 32123 · art. 8.2", "8.2. En el caso del SPP, el aporte obligatorio está constituido por:<br>a) El 10 % sobre la remuneración asegurable destinada a la CIC.<br>b) Un porcentaje de la remuneración asegurable, destinada a financiar las prestaciones de invalidez y sobrevivencia y un monto destinado a financiar la prestación de gastos de sepelio, conforme a las reglas dispuestas para ello en la normativa vigente del SPP.<br>c) Una comisión sobre la base de lo establecido en el inciso<br>c) del artículo 30 del TUO de la Ley del Sistema Privado de Administración de Fondos de Pensiones, aprobado por el Decreto Supremo 054-97-EF."], "Ley 8.ª DCF": ["Ley N° 32123 · 8.ª disposición complementaria final", "OCTAVA. Atención progresiva de los aportes realizados de manera incorrecta al SNP<br>a) A la edad de jubilación, las personas afiliadas al SPP que tengan aportes declarados y pagados de manera incorrecta al SNP por parte de sus empleadores pueden solicitar el pago de una pensión ante la ONP, siempre que con solo dichos aportes se cumpla el requisito establecido para el acceso a una pensión.<br>b) Los aportes a considerar en el literal anterior no deben haber sido devueltos por la Sunat, ni haber sido transferidos por la ONP conforme a lo dispuesto en la sétima disposición complementaria final del Decreto Legislativo 1275, o haber sido pagados a través del Régimen de Reprogramación de Pago de Aportes Previsionales al Fondo de Pensiones aprobado a través del artículo 25 del Decreto Legislativo 2750, o el Régimen de Reprogramación de Pago de Aportes Previsionales a los Fondos de Pensiones aprobado a través del Decreto de Urgencia 030- 2019 o cualquier otra reprogramación aprobada previa a la vigencia de la presente ley. En caso de que el aporte haya sido acogido dentro de las reprogramaciones aprobadas conforme a las normas citadas en el presente numeral pero no han sido consignados en la CIC de la persona afiliada, los aportes pueden ser considerados para el beneficio establecido en el literal a).<br>c) El acceso a una pensión en el SNP no limita a las personas afiliadas al SPP a"], "Ley 9.ª DCF": ["Ley N° 32123 · 9.ª disposición complementaria final", "NOVENA. Incentivos al ahorro<br>a) A fin de incentivar el ahorro, el MEF de manera anual y de conformidad con las previsiones presupuestarias, puede asignar recursos del tesoro público para el financiamiento de un aporte complementario equivalente al aporte voluntario con fin previsional realizado directamente por las personas afiliadas al Sistema.<br>b) El aporte del Estado no puede exceder del monto equivalente a una (1) unidad de aporte sobre una remuneración mínima vital anualmente.<br>c) En caso de que los aportes voluntarios con fin previsional, sujetos al incentivo, realizados por las personas afiliadas al Sistema, excedan los recursos destinados por el Estado para el financiamiento anual del aporte complementario, la distribución de estos recursos se realiza de manera proporcional al aporte realizado por cada beneficiario y al tope establecido en el numeral 2 de la presente disposición.<br>d) El aporte del Estado se efectúa a favor de los afiliados que realizan aportes voluntarios con fin previsional y que perciban ingresos mensuales que no excedan el 0.25 de la UIT.<br>e) A través del reglamento, se definen los mecanismos para la implementación de la presente disposición. El MEF realiza cada tres (3) años una evaluación del incentivo al ahorro, cuyos resultados permiten revisar la continuidad de la presente disposición, así como la introducción de ajustes en los mecani"], "RJ28 1": ["R.J. N° 000028-2026-JF-ONP · Plan de Implementación de la PAST y la FAS · art. 1", "Artículo 1. Aprobación del Plan de Implementación de la PAST y de la FAS Apruébase el Plan de Implementación de la Plataforma de Afiliación Segura y Transparente (PAST) y de la Ficha del Afiliado al Sistema (FAS), el que, como Anexo, forma parte integrante de la presente Resolución."], "RJ79 1": ["R.J. N° 000079-2026-JF-ONP · Lineamientos de gobernanza de la PAST · art. 1", "Artículo 1. Aprobación de Lineamientos para la Gobernanza de la PAST Apruébese los Lineamientos para la Gobernanza de la Plataforma de Afiliación Segura y Transparente (PAST), los que, como Anexo, forman parte integrante de la presente Resolución."], "ROP 10": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 10", "Artículo 10.- Transferencia de fondos y ﬁ nanciamiento de la prestación 10.1 Una vez reconocida la pensión en el pilar semicontributivo, mediante acto administrativo ﬁ rme comunicado por la ONP al aﬁ liado y a la EAF, es decir, cuando no se haya interpuesto recurso administrativo dentro del plazo establecido o habiéndose presentado, este haya sido resuelto, la EAF realiza la transferencia a la ONP de los recursos de la CIC, incluyendo, de corresponder, el monto redimido del BdR. 10.2 Las EAF deben remitir el Archivo Plano de Transferencia (APT-SPP) conforme a la estructura señalada en el Anexo 4, para lo cual previamente deben cerrar la CIC y transferir los recursos a una cuenta por pagar, conforme a las disposiciones que emita la Superintendencia para dicho ﬁ n. 10.3 La ONP valida el APT-SPP dentro del plazo máximo de un (1) día hábil, de no existir observaciones. Asimismo, la ONP gestiona con la entidad bancaria la habilitación del monto a transferir y remite a la EAF el ticket para la transferencia de la CIC, como máximo al día hábil siguiente. Caso contrario, la ONP comunica a la EAF las inconsistencias detectadas para la subsanación del archivo. 10.4 El plazo para efectuar la transferencia de dichos recursos es de quince (15) días calendario, contados a partir del acto administrativo ﬁ rme o agotada la vía administrativa. 10.5 La EAF debe transferir a la ONP, con cargo a f…"], "ROP 11": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 11", "Artículo 11.- Inicio de la pensión 11.1 El inicio de la pensión se establece a partir de la fecha de presentación de la solicitud por parte del aﬁ liado ante la EAF, siempre que este cumpla con las condiciones y requisitos exigidos para su otorgamiento. 11.2 La ONP procede a gestionar la apertura de la cuenta bancaria a nombre del pensionista a ﬁ n de que pueda hacer efectivo el cobro de su pensión. 11.3 El pago de las pensiones se realizará en las fechas que se establecen en el cronograma de pago de pensiones semicontributivas que se apruebe mediante Resolución Viceministerial del Ministerio de Economía y Finanzas. 11.4 Mensualmente, la ONP envía reportes a las EAF y a la SBS de los pensionistas con abonos realizados y sobre los pensionistas fallecidos. En caso de que las EAF tomen conocimiento del fallecimiento de un aﬁ liado que cuenta con una pensión del pilar semicontributivo, debe informar a la ONP de dicho suceso, conforme al formato incluido en la Resolución Jefatural N° 110-2003-JEFATURA/ONP o norma que la sustituya. TÍTULO III PRESTACIONES DE SOBREVIVENCIA"], "ROP 23": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 23", "Artículo 23.- Pago en la cuenta de los solicitantes 23.1 La ONP gestiona la apertura de las cuentas bancarias exclusivamente en el Banco de la Nación, a nombre de los solicitantes, a ﬁ n de viabilizar el pago de los gastos de sepelio. 23.2 El pago se realizará en las mismas fechas que se establecen en el cronograma de pago de las pensiones que administra la ONP, teniendo en cuenta el mes de pago indicado en la resolución que reconoce el beneﬁ cio. 23.3 Asimismo, procede a gestionar la planilla para el pago de gastos de sepelio, los que serán ﬁ nanciados con cargo al fondo de la cuenta FCR-SPP. En caso el fondo resulte insuﬁ ciente, la planilla de pago de gastos de sepelio se ﬁ nanciará con recursos del Tesoro Público. 23.4 El ﬁ nanciamiento de los gastos de sepelio será asumido por la ONP sin exceder el límite establecido por la SBS para el SPP. DISPOSICIONES FINALES Y TRANSITORIAS Primera.- Vigencia del reglamento operativo e inicio de asesoría, recepción y atención de solicitudes El presente reglamento operativo entra en vigencia al día siguiente de su publicación en el diario oﬁ cial El Peruano. Las EAF y la ONP tienen un plazo de adecuación de sus procesos internos, de hasta cien (100) días hábiles, contados a partir del día siguiente de la fecha de publicación del presente reglamento operativo. Culminado el referido plazo, se inicia el proceso de asesoría, recepción y aten…"], "ROP 7": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 7", "Artículo 7.- Presentación de la solicitud de pensión de jubilación o invalidez en el pilar semicontributivo 7.1 Sobre la base de la información proporcionada por la EAF, en caso el aﬁ liado decida voluntariamente iniciar su trámite de acceso a una prestación del pilar semicontributivo, lo realizará a través de los canales de atención que las EAF dispongan. 7.2 En caso el aﬁ liado estuviera imposibilitado de efectuar el trámite, podrá realizarlo mediante un representante, sujetándose a las disposiciones emitidas por la SBS sobre el particular. 7.3 La solicitud de pensión de jubilación o invalidez del pilar semicontributivo, corresponde al Anexo 01 del presente reglamento operativo, debiendo tener en consideración lo siguiente:<br>a. Documentación que permita sustentar los aportes realizados al SNP, anteriores a julio de 1999, los cuales, complementados con los aportes realizados al SPP, permitan alcanzar las UdA requeridas para el acceso a la prestación del pilar semicontributivo, en los casos en que no se haya tramitado el BdR. Para ello, el aﬁ liado puede presentar, entre otros, copias de los siguientes documentos: - Boletas de pago. - Liquidación de tiempo de servicios. - Certiﬁ cado de retención de impuesto de quinta categoría. - Comprobantes de pago de aportaciones para los períodos de aportación como asegurado facultativo.<br>b. Para el caso de trabajadores dependientes: s…"], "ROP 8": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 8", "Artículo 8.- Proceso de evaluación de requisitos y documentación anexa a la solicitud de prestaciones a cargo de la EAF 8.1 Revisión preliminar por parte de la EAF: recibida la solicitud, en el plazo máximo de cinco (5) días hábiles, la EAF debe revisar que toda la documentación requerida sea presentada por el aﬁ liado y con relación a la información del SPP, evalúa el cumplimiento de los requisitos, para lo cual realiza lo siguiente:<br>a. Determina si el monto de la pensión del aﬁ liado al SPP, bajo la modalidad de retiro programado, resulta inferior al monto de las prestaciones otorgadas en el pilar semicontributivo. Para dicho cálculo, se considera la totalidad del saldo de la CIC, que incluye la rentabilidad generada y todos los tipos de aportes, tales como aportes obligatorios, aportes voluntarios con ﬁ n previsional, aportes de pensión por consumo, así como los recursos provenientes del BdR acreditados en la CIC, o la proyección de su valor de redención, cuando este haya sido emitido, pero aún no redimido.<br>b. En caso el aﬁ liado no haya realizado retiros de su CIC, la cantidad de las UdA se determina considerando la totalidad de los aportes realizados en el SPP, conforme a lo dispuesto en el numeral 42.4 del Reglamento de la Ley N° 32123.<br>c. En caso el aﬁ liado haya realizado retiros de su CIC, procede según lo siguiente: i. Determina el número y monto de retiros e…"], "ROP 9": ["Reglamento operativo de la pensión mínima y proporcional · R.P.E. N° 000087-2026-PE-ONP · art. 9", "Artículo 9.- Caliﬁ cación y emisión de acto administrativo a cargo de ONP 9.1 Recibida la solicitud, la ONP genera el expediente administrativo y evalúa el cumplimiento de los requisitos de acceso a las prestaciones del pilar semicontributivo y determina el tipo de pensión, conforme a lo dispuesto en el Reglamento referido a la pensión mínima y la pensión de jubilación proporcional especial. Asimismo, para que la ONP continúe con la caliﬁ cación de la solicitud de pensión, valida que el aﬁ liado no tenga la condición de pensionista por derecho propio en alguno de los regímenes previsionales administrados por el Estado, para cuyo efecto veriﬁ ca dicha información en el AIRHSP. 9.2 En caso el aﬁ liado haya presentado documentación para la acreditación de aportes al SNP correspondientes a períodos distintos a los consignados en la resolución del BdR, de existir, la ONP valida dicha documentación y adiciona las UdA que resultan acreditadas a las determinadas por la EAF en el Anexo N° 03. En caso el aﬁ liado no presente documentación, pero solicite que la ONP considere los aportes que obran en sus archivos, así como los que declare el aﬁ liado, estos son reconocidos siempre que la ONP pueda veriﬁ car su existencia en sus registros. Para la acreditación de aportes al SNP correspondientes a períodos a partir de julio de 1999, se aplica lo dispuesto en el artículo 45 del Reglamento de …"], "ROT 13": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 13", "Artículo 13.- Inicio del trámite 13.1 El trámite de traslado del SNP al SPP se inicia a solicitud del aﬁ liado o, para aﬁ liados menores de edad, a solicitud del representante legal, mediante el registro de los datos personales a través de la PAST. 13.2 Autenticado el aﬁ liado, la PAST pone a su disposición el Boletín Informativo correspondiente al proceso de traslado, el cual contiene información sobre las condiciones, requisitos y beneﬁ cios de cada régimen. El aﬁ liado debe conﬁ rmar expresamente su lectura mediante el mecanismo habilitado en la PAST. La falta de conﬁ rmación impide la continuación del trámite. 13.3 El aﬁ liado procede al registro de la información en el formulario de traslado en la PAST, según los datos de la solicitud de traslado del Anexo N° 01; adicionalmente, registra y valida datos de contacto, los cuales incluyen de manera obligatoria el correo electrónico y el número de teléfono celular. 13.4 La PAST, durante la presentación de la solicitud de traslado, realiza validaciones automáticas en línea, destinadas a veriﬁ car la identidad del solicitante y el cumplimiento de las condiciones necesarias para el inicio del trámite, con información proveniente de las entidades competentes y de las fuentes oﬁ ciales habilitadas, de acuerdo con lo siguiente:<br>a) Validación de identidad, orientada a conﬁ rmar la identidad y la supervivencia del solicitante median…"], "ROT 14": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 14", "Artículo 14.- Evaluación de la solicitud 14.1 En el plazo máximo de treinta (30) días hábiles contados a partir de la presentación de la solicitud de traslado en la PAST, la ONP revisa y evalúa la acreditación de los aportes efectuados al SNP, de conformidad con lo dispuesto en el artículo 70 del Decreto Ley N° 19990. 14.2 Dentro del mismo plazo, como resultado de la evaluación del traslado al SPP, la ONP genera el RESIT-SNP según la estructura del Anexo N° 02 y lo incorpora en la PAST para la continuidad del trámite."], "ROT 15": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 15", "Artículo 15.- Comunicación del RESIT-SNP y notiﬁ cación de la constancia de traslado 15.1 La ONP para la comunicación del RESIT-SNP utiliza los siguientes mecanismos:<br>a) Al aﬁ liado a través de la PAST, en un plazo máximo no mayor a tres (3) días hábiles de haberse emitido.<br>b) A la SBS y a la EAF mediante los mecanismos que se disponga, en el día de haberse emitido. 15.2 La ONP genera la constancia de traslado en el mismo día que se emite el RESIT- SNP:<br>a) Notiﬁ ca a través de la PAST al aﬁ liado, en un plazo no mayor a tres (3) días hábiles. En caso el aﬁ liado no remita el acuse de recepción, se continua con el procedimiento de notiﬁ cación de acuerdo con el marco normativo vigente.<br>b) Comunica a la SBS y a la EAF, a través de la PAST, en el mismo día de generada la constancia de traslado del SNP al SPP. 15.3 La ONP ejecuta la baja del aﬁ liado en el SNP, al ﬁ nalizar el día de la emisión de la constancia de traslado. 15.4 La SBS con la información disponible en la PAST, de manera automática lo incorpora al SPP al día siguiente de la recepción de la constancia de traslado, a partir de lo cual el nuevo estado en el SIPP queda actualizado. CAPÍTULO II: DEL SPP AL SNP"], "ROT 18": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 18", "Artículo 18.- Presentación de la solicitud ante la EAF 18.1 En caso de que el aﬁ liado decida voluntariamente iniciar el trámite de traslado, debe presentar ante la EAF la solicitud correspondiente, en la cual maniﬁ este su voluntad expresa, conforme con las disposiciones normativas de la SBS aplicables al SPP, así como la declaración en la que conste haber tomado conocimiento del Boletín Informativo. 18.2 En caso el aﬁ liado sea menor de edad o estuviera imposibilitado de efectuar el trámite, podrá realizarlo mediante un representante debidamente acreditado, quien debe sujetarse a las disposiciones conforme al Código Civil. 18.3 El aﬁ liado puede, de manera voluntaria, declarar períodos de aportación al SNP con anterioridad a julio de 1999, a efectos de solicitar el reconocimiento de las UdAs asociadas a dichos aportes, salvo aquellas que provengan de un BdR otorgado. Los períodos declarados serán evaluados por la ONP y, de corresponder, serán reconocidos conforme a la normativa previsional vigente. La presentación de esta solicitud y la evaluación que realice la ONP no suspenden ni interrumpen el trámite de traslado 18.4 La EAF comunica al aﬁ liado el registro de su solicitud para su seguimiento. 18.5 La EAF valida los requisitos y condiciones para el traslado, orientada a veriﬁ car la situación previsional del solicitante y la inexistencia de impedimentos para el inicio del …"], "ROT 19": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 19", "Artículo 19.- Generación del RESIT-SPP 19.1 La EAF genera el RESIT-SPP una vez que se haya veriﬁ cado el cumplimiento de los requisitos aplicables al traslado. 19.2 El RESIT-SPP contiene la información según la estructura del Anexo N° 03. 19.3 La equivalencia de las UdAs del SPP es determinada y calculada por la EAF, en consideración de la tasa de aporte correspondiente a cada régimen previsional vigente en el mes de devengue de cada aporte efectuado, de conformidad con lo dispuesto en el artículo 43 del Reglamento. En caso el aﬁ liado haya dispuesto de los recursos de la CIC, se ajustan las UdAs equivalentes a efectos de determinar las UdAs efectivas equivalentes. A continuación, se deﬁ ne la regla de cálculo aplicable para cada caso: 19.3.1 Cuando el aﬁ liado no ha dispuesto de sus recursos: En caso la CIC se mantenga íntegra al no haberse dispuesto de sus recursos, la fórmula para determinar el total de UdAs efectivas equivalentes corresponde a la siguiente expresión: ܷ ܰ݁ݍൌ෍ܷ݀ܣ݇ ݁ݍ ݐ ݇ൌͳ<br>a) En caso de un único empleador o empresa en el mes devengue: ܷ݀ܣ\u0003\u0003ܵܲܲ݇ൌ\u0003ܯ݅݊൤ͳǡ ܣ݌݋ݎݐ݁݇ ܶܽݏܽ\u0003ܵܲܲ݇ή ܯܽݔሾܴܣܯ݇ǡ ܴܯܸ݇ሿ൨ ܷ݀ܣ݇ ݁ݍൌ\u0003ܷ݀ܣ\u0003ܵܲܲ݇ή ܯ݅݊൤ͳǡ ܶܽݏܽ\u0003ܵܲܲ݇ ܶܽݏܽ\u0003ܵܰܲ݇ ൨<br>b) En caso de más un empleador o empresa para el mismo mes de devengue: La UdA SPP y la UdA equivalente se calculan de forma individualizada por empleador o empresa, y los resultados se debe consignar en el Anexo N° 03. ܷ…"], "ROT 20": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 20", "Artículo 20.- Registro de la información de la solicitud de traslado del SPP al SNP en la PAST 20.1 El registro de la información de las solicitudes en la PAST es realizado por la EAF debidamente autenticada, conforme a los mecanismos de seguridad e identiﬁ cación establecidos en la PAST, y que permitan generar interoperabilidad e interconexión. 20.2 La EAF realiza el registro individual o masivo de la información de las solicitudes en la PAST, utilizando la estructura de datos del formato del Anexo N° 04.<br>a) La PAST realiza validaciones automáticas destinadas a veriﬁ car la identidad, supervivencia del aﬁ liado y el cumplimiento del periodo mínimo de permanencia en el régimen previsional de origen, para la continuación del trámite.<br>b) Como resultado de las validaciones, si se determina que alguna solicitud recibida por la EAF no cumple con las condiciones para el traslado o presenta errores en su registro, la PAST informa los motivos del incumplimiento, sin generar el registro del trámite, ni afectar el tratamiento de la información de las demás solicitudes registradas, de corresponder. 20.3 La EAF realiza la carga de la información del RESIT-SPP en la PAST, en consideración de la estructura de datos del formato del Anexo N° 03.<br>a) La PAST realiza validaciones automáticas destinadas a veriﬁ car la consistencia u omisiones del RESIT- SPP.<br>b) Como resultado de las va…"], "ROT 21": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 21", "Artículo 21.- Reconocimiento y equivalencia de UdAs 21.1 La ONP veriﬁ ca y valida la equivalencia de UdAs remitida por la EAF y, de corresponder, procede a su reconocimiento y registro en la historia previsional del aﬁ liado. 21.2 Como resultado del procedimiento de reconocimiento y equivalencia, la ONP genera el RESIT-SNP, el cual contiene el detalle de las UdAs reconocidas en el SNP y el SPP, así como la información previsional correspondiente. 21.3 La ONP remite mediante la PAST a la EAF el RESIT-SNP en un plazo máximo de treinta (30) días hábiles contados desde la recepción del RESIT-SPP."], "ROT 23": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 23", "Artículo 23.- Emisión de la constancia de traslado y aﬁ liación al SNP 23.1 La SBS, el mismo día en que la EAF registra la conformidad del aﬁ liado en la PAST, debe:<br>a) Emitir la constancia de traslado y remitir la información de la misma a la EAF y a la ONP a través de los mecanismos habilitados para tal efecto.<br>b) Ejecutar la baja del aﬁ liado en el SPP al culminar el día de la emisión de la constancia de traslado. 23.2 La ONP con la información disponible en la PAST incorpora al aﬁ liado al SNP, al día siguiente calendario de emitida la constancia de traslado, a partir de lo cual el nuevo estado en el SIPP queda actualizado. 23.3 La EAF en un plazo máximo de cinco (5) días hábiles de recibida la constancia de traslado, comunica al aﬁ liado mediante los mecanismos habilitados para tal efecto."], "ROT 24": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 24", "Artículo 24.- Transferencia del saldo de la CIC y constancia de transferencia 24.1 Emitida la constancia de traslado del SPP al SNP, la EAF debe efectuar la transferencia del cien por ciento (100 %) del saldo acumulado de la Cuenta Individual de Capitalización (CIC) correspondiente a los aportes obligatorios, a favor del Fondo Consolidado de Reservas Previsionales – Fondo FCR del Decreto Ley N° 19990. 24.2 Recibida la constancia de traslado, la EAF remite a la ONP, a través de la PAST, la información para la transferencia de la CIC en un plazo máximo de cinco (5) días hábiles, en consideración del formato del Anexo N° 05 (APT – SPP), para lo cual previamente debe cerrar la CIC y transferir los recursos a una cuenta por pagar, conforme a las disposiciones que emita la SBS para dicho ﬁ n. Para ello:<br>a) La ONP valida la consistencia de la información remitida por la EAF dentro del plazo máximo de un (1) día hábil, de haberla recibido.<br>b) En caso se identiﬁ quen observaciones, la ONP devuelve la información a la EAF para su revisión y subsanación, de corresponder. 24.3 Validada la información, la ONP comunica a la EAF a través de la PAST, que el monto se encuentra habilitado para la transferencia mediante las entidades bancarias correspondientes. 24.4 Recibida la conformidad de la ONP para la transferencia, la EAF cuenta con un plazo máximo de quince (15) días calendario para…"], "ROT 25": ["Reglamento Operativo de Traslados · R.P.E. N° 000081-2026-PE-ONP · art. 25", "Artículo 25.- Aportes recuperados posterior a la transferencia de traslado. 25.1 Los aportes identiﬁ cados o recuperados por las EAF, incluidos los intereses moratorios, posteriores al cierre de la cuenta, son transferidos a la ONP en consideración del formato del Anexo N° 05 (APT – SPP), donde se consigna el estado de aporte con el código 2 (identiﬁ cados o recuperados). La transferencia debe efectuarse dentro del mes siguiente a aquel en que los aportes fueron identiﬁ cados o recuperados, siempre que el aﬁ liado permanezca incorporado al SNP al momento de realizarse dicha transferencia. 25.2 Para dicho efecto, previamente la EAF determina las UdAs efectivas equivalentes, elabora el archivo de transferencia conforme con el Anexo N° 05 (APT – SPP) para remitirlo a la ONP a través de los mecanismos de comunicación habilitados para tal efecto. 25.3 Los aportes identiﬁ cados o recuperados con posterioridad al traslado son acreditados por la ONP mediante los mecanismos que para tal ﬁ n disponga. DISPOSICIONES COMPLEMENTARIAS FINALES Primera.- Normas complementarias emitidas por la SBS La SBS emite las normas complementarias necesarias para la implementación del presente Reglamento Operativo, que incluyen los plazos de adecuación que correspondan para las EAF. Segunda.- Información a los aﬁ liados del SNP que soliciten el traslado al SPP, que tengan por lo menos 65 años y que hayan …"], "Reg 101": ["Reglamento · D.S. N° 189-2025-EF · art. 101", "Artículo 101. Pago del Beneficio Complementario 101.1. Corresponde percibir el beneficio complementario a partir del mes de enero del año fiscal siguiente al inicio de la recaudación del aporte. La ONP comunica mediante cronograma el inicio y las fechas del pago mensual del beneficio complementario. 101.2. En los casos que, a través de pronunciamientos administrativos o judiciales firmes se reconozca el beneficio complementario o la regularización del monto del beneficio de periodos cuyo fondo se hayan cancelado, la ONP atiende la obligación del pago con cargo al fondo del ejercicio fiscal que se viene recaudando y conforme lo establece la Ley N° 30137, Ley que establece criterios de priorización para la atención del pago de sentencias judiciales y modificatorias. Para la determinación del importe, se mantendrá el factor de reparto determinado en cada ejercicio cancelado. 101.3. El monto anual del beneficio es programado en 12 pagos mensuales en el año. Con el primer pago mensual programado en el año, se reintegra los meses que no se hubieran efectuado el pago. 101.4. En atención a que la determinación del monto del FCJTP se realiza por cada ejercicio fiscal, la distribución del Beneficio Complementario entre los beneficiarios tiene efecto cancelatorio. 101.5. De resultar insuficientes los recursos del fondo, el pago se realiza de manera proporcional al beneficio complementario…"], "Reg 104": ["Reglamento · D.S. N° 189-2025-EF · art. 104", "Artículo 104. Asignación de recursos públicos al Sistema 104.1. El MEF realiza anualmente asignación de recursos a la ONP, considerando los principios de sostenibilidad fiscal y equilibrio presupuestario, garantizando la cobertura progresiva de las prestaciones no contributivas. 104.2. Los aportes voluntarios con fin previsional cubiertos con recursos del Tesoro Público son aprobados en la Ley de Presupuesto para cada año fiscal."], "Reg 109": ["Reglamento · D.S. N° 189-2025-EF · art. 109", "Artículo 109. Financiamiento de las prestaciones semicontributivas 109.1. Las pensiones del pilar semicontributivo otorgado a los afiliados del SNP se financian con las fuentes de recursos establecidos para este régimen previsional. 109.2. Las prestaciones semicontributivas a los afiliados del SPP son financiadas con recursos del Fondo FCR-SPP, completados con transferencias de recursos públicos, destinado a cubrir la insuficiencia de recursos necesarios para el pago de la planilla de pensiones."], "Reg 110": ["Reglamento · D.S. N° 189-2025-EF · art. 110", "Artículo 110. Financiamiento de las prestaciones no contributivas 110.1. Las PNC se financian con:<br>a. Recursos ordinarios del Tesoro Público.<br>b. Saldos existentes en la CIC de las personas afiliadas al SPP que acceden a una PNC, de corresponder. 110.2. Los programas sociales realizan anualmente una proyección del crecimiento de la población objetivo para su presentación y evaluación, la cual es remitida a la ONP a más tardar el último día hábil de cada mes de marzo del año anterior, con la finalidad de que la ONP gestiona ante el MEF la asignación presupuestal necesaria para ejecutar el pago de la PNC, de acuerdo con la capacidad financiera del Estado. CAPÍTULO III FONDOS ADMINISTRADOS POR EL FONDO CONSOLIDADO DE RESERVAS PREVISIONALES- FCR"], "Reg 111.1": ["Reglamento · D.S. N° 189-2025-EF · art. 111.1", "111.1. De acuerdo al artículo 12 de la Constitución, los fondos del FCR, como fondos de seguridad social en pensiones, son intangibles, no pudiendo ser donados, embargados, rematados, dados en garantía o destinados para otro fin que no sea de carácter previsional."], "Reg 112": ["Reglamento · D.S. N° 189-2025-EF · art. 112", "Artículo 112. Fondos administrados por el FCR El FCR tiene a su cargo distintos fondos, mediante la inversión adecuada, directamente o a través de contratos con entidades de reconocido prestigio. En el marco de la Ley el FCR administra estos fondos, en adición a los que ya se encuentran bajo su administración.<br>a) Fondos transferidos del SPP para el pago de pensiones semicontributivas (FCR-SPP): son recursos transferidos por la EAF al FCR, para el financiamiento colectivo de la planilla de pensiones de los afiliados del SPP que acceden a prestaciones del pilar semicontributivo. Estos recursos son intangibles y solo deben emplearse para el pago de los beneficios con garantía estatal a los afiliados del SPP. Los recursos de este fondo se integran en un fondo común y de reparto.<br>b) Fondo para prestaciones no contributivas (FCR-PNC): son recursos transferidos por la EAF al FCR provenientes de la CIC de los afiliados al SPP que accedan a prestaciones del pilar no contributivo. Estos recursos son intangibles y solo deben emplearse para el pago de pensiones no contributivas. Los recursos de este fondo se integran en un fondo común y de reparto."], "Reg 117": ["Reglamento · D.S. N° 189-2025-EF · art. 117", "Artículo 117. Funciones del Ministerio de Economía y Finanzas para el monitoreo y control de las obligaciones previsionales Para el monitoreo y control de las obligaciones previsionales, el MEF desarrolla las siguientes funciones:<br>a. Registro y Control: realizar anualmente el registro y control de las obligaciones previsionales a cargo del Estado, con el fin de asegurar el cumplimiento de las responsabilidades financieras del Estado en materia de pensiones.<br>b. Evaluación y seguimiento: realizar la evaluación y seguimiento del desempeño del sistema de pensiones.<br>c. Salud Financiera: velar por la salud financiera de los sistemas previsionales contributivos, promoviendo medidas para garantizar su sostenibilidad y estabilidad a largo plazo."], "Reg 118.1": ["Reglamento · D.S. N° 189-2025-EF · art. 118.1", "118.1. Anualmente la ONP y la SBS remiten al MEF información del SNP y SPP respectivamente, la ONP debe presentar la información en los formatos que se le requiera para ese objeto. La SBS suscribe convenios con el MEF, a efectos de presentar la información que forme parte en lo concerniente al ámbito previsional. La información a la que se acceda tiene carácter confidencial y constituye parte de los datos protegidos por la Ley Nº 29733."], "Reg 13.2": ["Reglamento · D.S. N° 189-2025-EF · art. 13.2", "13.2. La ONP y la SBS comparten la gobernanza de los procesos a cargo de la PAST. Para ello, la ONP en coordinación con la SBS, aprueba los lineamientos sobre estructura, adaptabilidad, mejoras y gestión de los procesos que a esta se le encarguen."], "Reg 13.3": ["Reglamento · D.S. N° 189-2025-EF · art. 13.3", "13.3. La creación y la operatividad de la PAST están a cargo de la ONP, para lo cual el RENIEC y MIGRACIONES proporcionan la información de identificación y datos de contacto, de corresponder, de los ciudadanos y extranjeros en el Sistema. Para este fin debe priorizarse la interoperabilidad de las entidades señaladas, conforme el marco regulatorio vigente en materia de gobierno y transformación digital."], "Reg 14.1": ["Reglamento · D.S. N° 189-2025-EF · art. 14.1", "14.1. Para el adecuado cumplimiento del proceso de elección y afiliación al Sistema, a través de la PAST, corresponde al RENIEC brindar a la ONP la información siguiente:<br>a. Remite trimestralmente, los datos de las personas que van a cumplir dieciocho (18) años en el trimestre siguiente, complementando esta información con el correo electrónico en el trimestre subsiguiente (en caso de que se cuente con la autorización del titular).<br>b. Remite, por única vez, en los plazos que para ello se determine, la información de las personas mayores de dieciocho (18) años que no estén afiliados al Sistema o algún régimen previsional existente a la fecha de entrada en vigor de la Ley.<br>c. Para el cumplimiento del acápite anterior, la ONP remite, previamente al RENIEC, la información actualizada de las personas que debe excluir por ser pensionistas o estar afiliados al Sistema o algún régimen previsional existente.<br>d. La información del RENIEC señalada en literales a y b del presente numeral, debe incluir los datos de identificación de la persona (tipo y número de documento de identidad, apellido paterno, apellido materno, nombres), fecha de nacimiento, dirección, ubigeo de la dirección y correo electrónico (en caso de que se cuente con la autorización del titular)."], "Reg 15.1": ["Reglamento · D.S. N° 189-2025-EF · art. 15.1", "15.1. L a ONP es la entidad responsable de gestionar la PAST para el proceso de elección de las personas entre el SNP y el SPP."], "Reg 15.2": ["Reglamento · D.S. N° 189-2025-EF · art. 15.2", "15.2. Para la elección y afiliación al SNP o al SPP deben cumplirse las siguientes condiciones:<br>a. Elección del régimen: La persona al momento de la elección del régimen previsional completa el formulario de elección que se pone a disposición a través de la PAST, de acuerdo con las condiciones exigidas para cada tipo de afiliación y a través de los canales que se hayan dispuesto para tal fin. El formulario de elección contiene por lo menos lo siguiente: 1. Nombre: Es la consignación de los nombres y apellidos completos de la persona, tal como figura en el documento de identificación. 2. Número de identificación: Puede ser: i. El del Documento Nacional de Identidad (DNI), para los nacionales. ii. El del Carné de extranjería, pasaporte o cualquier documento de identidad permitido bajo las normas migratorias vigentes, en caso de los extranjeros. iii. En caso de no contar con los anteriores documentos, cualquier otro que permita su identificación de manera fehaciente, conforme a las disposiciones de la materia y los lineamientos que disponga la ONP. 3. Régimen elegido: La persona señala su elección por el SNP o el SPP.<br>b. Evaluación e interacción inicial: Recibido el formulario, la ONP confirma, de preferencia en línea, los datos indicados por la persona, verificando la validez de estos. Si hubiese duda por alguno de ellos, la ONP puede realizar observaciones y requerir a la …"], "Reg 16.1": ["Reglamento · D.S. N° 189-2025-EF · art. 16.1", "16.1. La FAS contiene la información de los afiliados del Sistema, bajo las siguientes reglas:<br>a. Accesibilidad: Los afiliados tienen acceso permanente a la FAS, en las plataformas que las EAF o la ONP, pongan a disposición de sus afiliados.<br>b. Modificabilidad: La FAS no es un documento rígido, sino que está en constante actualización con información de RENIEC, MIGRACIONES, SUNAT y otras bases de datos oficiales, brindando las EAF y la ONP todas las facilidades posibles al afiliado, conforme a lo siguiente: 1. De parte del afiliado: Siempre que se produzca variación de los campos en la FAS, el afiliado debe realizar la actualización. 2. De parte de las EAF y la ONP: Realiza la constante actualización respecto de los datos que cada régimen administra. Las EAF acceden a información de la SUNAT que no está protegida por la reserva tributaria"], "Reg 18.2": ["Reglamento · D.S. N° 189-2025-EF · art. 18.2", "18.2. El plazo para la elección de afiliación vence antes de cumplirse doce (12) meses contados a partir del día siguiente de cumplida la mayoría de edad. En caso la persona no elija en el plazo indicado queda automáticamente afiliado al SNP."], "Reg 19.3": ["Reglamento · D.S. N° 189-2025-EF · art. 19.3", "19.3. A partir del 1 de junio de 2028 y en caso de no haber elegido entre el SPP y el SNP, el ciudadano queda automáticamente afiliado al SPP y se sujetan a la licitación del servicio de administración de la CIC dispuesto en el artículo 7-A del TUO de la Ley del SPP."], "Reg 25.2": ["Reglamento · D.S. N° 189-2025-EF · art. 25.2", "25.2. Las EAF administran los aportes voluntarios del Sistema. SUBCAPÍTULO II APORTE OBLIGATORIO"], "Reg 31": ["Reglamento · D.S. N° 189-2025-EF · art. 31", "Artículo 31. Aporte voluntario con fin previsional 31.1. El aporte voluntario con fin previsional es el que realiza el afiliado de forma libre y extraordinaria con la finalidad de complementar los aportes requeridos para el acceso a pensiones semicontributivas o incrementar el monto que reciba al obtener una prestación dentro del pilar contributivo. 31.2. El aporte voluntario con fin previsional forma parte del Pilar Voluntario y puede ser de los siguientes tipos:<br>a. Aporte por transferencia directa del afiliado, siempre y cuando haya realizado un aporte obligatorio en el mes.<br>b. Aporte a través de la devolución por pagos en exceso del impuesto a la renta.<br>c. Aporte del Estado sustentado en los gastos por consumo.<br>d. Aporte del Estado para el incentivo al ahorro.<br>e. Aporte del Empleador. 31.3. El procedimiento para realizar el aporte voluntario con fin previsional se realiza conforme a las normas del SPP y las normas complementarias que, en el marco de sus competencias, dicte la SBS para ello, en coordinación con la ONP. 31.4. Los aportes voluntarios con fin previsional de los afiliados al SPP, se rigen bajo las normas del TUO de la Ley del SPP, reglamento y normas complementarias. 31.5. En el caso de los aportes con fin previsional con financiamiento del Estado, se rigen bajo las disposiciones específicas que se dicten para ello en el presente reglamento."], "Reg 34.1": ["Reglamento · D.S. N° 189-2025-EF · art. 34.1", "34.1. La determinación, retención, declaración y pago del aporte obligatorio al SNP de los trabajadores dependientes se regula según las normas tributarias."], "Reg 34.2": ["Reglamento · D.S. N° 189-2025-EF · art. 34.2", "34.2. El pago de los aportes obligatorios de los afiliados del SPP se realiza de conformidad con lo establecido en el TUO de la Ley del SPP, donde el empleador retiene el importe del aporte previsional al afiliado y realiza la declaración y pago a la entidad centralizadora establecida. El pago puede ser hecho a través de la institución financiera o de otra naturaleza que designe la entidad centralizadora mencionada."], "Reg 41.2": ["Reglamento · D.S. N° 189-2025-EF · art. 41.2", "41.2. En el caso del SPP, las EAF son responsables de realizar y continuar con la ejecución de las acciones de cobranza sobre los aportes retenidos y no pagados en el SPP, para los afiliados que se trasladen al SNP, o soliciten beneficios con garantía estatal, debiendo trasladar los montos recuperados al fondo del FCR-Decreto Ley N° 19990 o al FCR-SPP respectivamente."], "Reg 49.1": ["Reglamento · D.S. N° 189-2025-EF · art. 49.1", "49.1. El afiliado al SNP inicia su trámite de traslado ante la ONP a través de la PAST, para ser incorporado como afiliado de la EAF ganadora de la licitación vigente en el SPP. El traslado se acredita mediante la constancia de traslado que emite la ONP."], "Reg 49.2": ["Reglamento · D.S. N° 189-2025-EF · art. 49.2", "49.2. Corresponde a la ONP revisar y evaluar las condiciones del traslado, verificando las UdAs efectivas, en el plazo que se establezca en el reglamento operativo."], "Reg 50.1": ["Reglamento · D.S. N° 189-2025-EF · art. 50.1", "50.1. El afiliado al SPP inicia su trámite de traslado ante la EAF, que a su vez debe ingresar la solicitud a la PAST, utilizando el formulario de traslado implementado para tal fin."], "Reg 50.2": ["Reglamento · D.S. N° 189-2025-EF · art. 50.2", "50.2. La EAF en el plazo que establezca el reglamento operativo, remite a la ONP el Reporte Situacional del afiliado al SPP, el cual contiene la siguiente información:<br>a. Número de UdA acumuladas durante la permanencia del afiliado en el SPP, calculada según la fórmula establecida en el numeral 44.1 del artículo 44 del presente reglamento.<br>b. Condición laboral, de ser el caso<br>c. Monto de la pensión estimada o calculada.<br>d. Datos generales del afiliado.<br>e. Datos generales de los empleadores.<br>f. Saldo de la CIC.<br>g. Información de aportes en cobranza<br>h. Historial de aportaciones al SPP donde se consigna el monto del aporte, tipo de aporte, mes de devengue, fecha de pago."], "Reg 51.1": ["Reglamento · D.S. N° 189-2025-EF · art. 51.1", "51.1. L a EAF realiza la transferencia del 100% del saldo acumulado en la CIC de aportes obligatorios al FCR-Decreto Ley N° 19990, y emite una constancia de traslado que valida dicha acción."], "Reg 58.1": ["Reglamento · D.S. N° 189-2025-EF · art. 58.1", "58.1. Los afiliados al SNP presentan su solicitud de pensión a través de los canales que disponga la ONP. La ONP evalúa el cumplimiento de los requisitos de acceso a la prestación solicitada, en el plazo que se establezca en el reglamento operativo."], "Reg 58.2": ["Reglamento · D.S. N° 189-2025-EF · art. 58.2", "58.2. Los afiliados al SPP presentan sus solicitudes de pensión a través del EAF. La EAF recibida la solicitud debe realizar lo siguiente:<br>a. Valida las UdA efectivas requeridas para acceder a las prestaciones del pilar semicontributivo. Los aportes en cobranza no se contabilizan como UdA.<br>b. Verifica que el afiliado no haya efectuado retiros con posterioridad a la vigencia de la Ley salvo aquellos retiros establecidos en los artículos 40 y 42-A del TUO de la Ley del SPP.<br>c. Valida que el monto de la pensión bajo la modalidad de retiro programado sea inferior al monto de las prestaciones otorgadas en el pilar semicontributivo.<br>d. Para el cálculo de la pensión bajo la modalidad de retiro programado se considera al afiliado y sus beneficios con derecho a pensión de sobrevivencia, y se toma en cuenta la totalidad del saldo CIC, compuesta por los aportes y la rentabilidad generada. Para el cálculo se incluye todos los tipos de aportes, tales como los aportes obligatorios, los aportes voluntarios con fin previsional, aportes destinados a pensión por consumo, otros aportes que puedan ser instaurados en el futuro, así como el Bono de Reconocimiento. En caso de que el Bono de Reconocimiento haya sido emitido, pero aún no haya sido redimido, se considera la proyección de su valor de redención.<br>e. Informa al afiliado el monto estimado de su pensión en el SPP bajo la modali…"], "Reg 60.1": ["Reglamento · D.S. N° 189-2025-EF · art. 60.1", "60.1. La EAF, dentro del plazo máximo que se establezca en el reglamento operativo realiza la transferencia del 100% del saldo acumulado en la CIC al Fondo FCR-SPP. Este saldo incluye tanto los aportes como la rentabilidad generada."], "Reg 71": ["Reglamento · D.S. N° 189-2025-EF · art. 71", "Artículo 71. Aporte voluntario de las personas naturales afiliadas al Sistema que generan rentas de cuarta y/o de quinta categoría del impuesto a la renta y que cuenten con un monto de devolución por pagos en exceso por dichas rentas 71.1. Las personas naturales que perciben rentas de cuarta y/o de quinta categoría a que se refieren los artículos 33 y 34 de la Ley del Impuesto a la Renta pueden comunicar a la SUNAT que el monto de la devolución por pagos en exceso por dichas rentas que soliciten se abone a su CIC como aportes voluntarios con fin previsional. 71.2. Para efecto de lo dispuesto en el numeral anterior, se debe tener en cuenta lo siguiente:<br>a. Solo procede el referido aporte voluntario tratándose de la devolución de pagos en exceso por rentas de cuarta y/o quinta categoría que ha sido solicitada por la persona natural que tiene derecho a dicha devolución.<br>b. No procede el mencionado aporte voluntario si es que la persona natural además de las rentas de cuarta y/o de quinta categoría obtiene rentas de fuente extranjera que se suman a estas.<br>c. Al momento de realizar la comunicación la persona natural debe encontrarse afiliada al SPP o SNP y contar con una CIC de aportes voluntarios con fin previsional administrada por una EAF. Lo anterior debe mantenerse hasta que se realice el mencionado aporte voluntario.<br>d. El sujeto que tiene derecho a la devolución n…"], "Reg 77.1": ["Reglamento · D.S. N° 189-2025-EF · art. 77.1", "77.1. La SUNAT debe proporcionar al MEF por cada ejercicio fiscal la relación de las personas naturales cuyos gastos por consumo se deben considerar para efecto de la pensión por consumo, identificándolas con sus nombres y apellidos y el número de su DNI y señalando por cada una de ellas el monto al que corresponde aplicar el porcentaje establecido en el párrafo 35.7 del artículo 35 de la Ley."], "Reg 78.1": ["Reglamento · D.S. N° 189-2025-EF · art. 78.1", "78.1. E l aporte por consumo equivale al uno por ciento (1%) de la base de cálculo del aporte determinado conforme al artículo 75 del presente reglamento. El pago del Aporte por Consumo se encuentra a cargo de la ONP, la misma que realiza el pago del beneficio a las EAF para que acrediten dicho aporte a los afiliados al Sistema. Dicho pago se realiza con cargo a los recursos previstos en las Leyes anuales de presupuesto y conforme a los procedimientos que se regulen en la normatividad presupuestaria vigente."], "Reg 85.1": ["Reglamento · D.S. N° 189-2025-EF · art. 85.1", "85.1. La administración del pago de las PNC, como parte del Sistema, se encuentra a cargo de la ONP."], "Reg 88": ["Reglamento · D.S. N° 189-2025-EF · art. 88", "Artículo 88. Registro en el AIRHSP La ONP registra los nuevos pensionistas de PNC en el AIRHSP, a partir del primer pago que realice. Asimismo, actualiza de manera continua dicho registro, en concordancia con las relaciones de beneficiarios aprobados mediante las Resoluciones de Dirección Ejecutiva correspondientes."], "Reg 89.1": ["Reglamento · D.S. N° 189-2025-EF · art. 89.1", "89.1. L os Programas Sociales son responsables de la validación e identificación de los terceros autorizados que se haya determinado para el cobro de la PNC."], "Reg 89.2": ["Reglamento · D.S. N° 189-2025-EF · art. 89.2", "89.2. Los Programas Sociales remiten a la ONP un listado preliminar de potenciales beneficiarios y/o terceros autorizados al cobro, previo a la emisión de la Resolución de Dirección Ejecutiva, con el fin de que la ONP realice la apertura de las cuentas bancarias individuales en el Banco de la Nación. El listado de cuentas gestionadas debe ser comunicado por la ONP a los Programas Sociales, a fin de que procedan con la elaboración del padrón o relación de usuarios, según sea el caso."], "Reg 94": ["Reglamento · D.S. N° 189-2025-EF · art. 94", "Artículo 94. Obligación del pago del aporte al FCJTP 94.1. A partir de la entrada en vigor de la Ley, el armador debe efectuar el aporte mensual al FCJTP equivalente al 5% de la remuneración asegurable mensual del trabajador pesquero. 94.2. El armador pesquero, a la vigencia de la obligación del pago del aporte al FCJTP, ya no realiza el aporte dispuesto en el artículo 9 de la Ley N° 30003 respecto de sus trabajadores pesqueros."], "Reg 95.1": ["Reglamento · D.S. N° 189-2025-EF · art. 95.1", "95.1. L a ONP se encarga de la administración del beneficio complementario. En el caso de los pensionistas pesqueros del SPP, las EAF deben remitirle a la ONP, la relación de los beneficiarios del FCJTP con la información necesaria para el cálculo del beneficio complementario."], "Reg 95.2": ["Reglamento · D.S. N° 189-2025-EF · art. 95.2", "95.2. Los recursos del FCJTP son administrados por el FCR, contabilizándose de manera independiente de los demás recursos a su cargo. La administración de los recursos se rige por los lineamientos que ha determinado el Directorio del FCR."], "Reg 96": ["Reglamento · D.S. N° 189-2025-EF · art. 96", "Artículo 96. Declaración y pago del aporte por parte del armador 96.1. El aporte al FCJTP debe ser declarado y pagado por el armador en el plazo establecido en el artículo 29 del Código Tributario para los tributos de determinación mensual y en la forma, condiciones, lugar y cronograma que establezca la SUNAT mediante resolución de superintendencia. 96.2. El aporte al FCJTP se registra mensualmente en la CITPA-FCJTP, conforme a la declaración realizada por los armadores ante la SUNAT. En esa cuenta se registra la información de los aportes mensuales declarados. La SUNAT implementa la CITPA-FCJTP en coordinación con la ONP."], "L32445 DCD": ["Ley N° 32445 · disposición complementaria derogatoria", "DISPOSICIÓN COMPLEMENTARIA DEROGATORIA ÚNICA. Derogación del artículo 9 y de la décimo sétima disposición complementaria final de la Ley 32123, Ley de Modernización del Sistema Previsional Peruano Se derogan el artículo 9 y la décimo sétima disposición complementaria final de la Ley 32123, Ley de Modernización del Sistema Previsional Peruano."]};

  :(cur?`<p><b>${ART_N[cur.de]}</b> ${cur.d}</p>`:'');
 const nota=!norma&&g&&NOTAS[g]?`<div class="nota">${NOTAS[g][0]} ${NOTAS[g][1].map(chip).join(' ')}</div>`:'';
 return `<div class="card canvas"><div class="hd" data-k="${sel||ns}">${hd}</div>${nota}<svg class="map" viewBox="${Math.round(VB.x0)} ${Math.round(VB.y0)} ${Math.round(w)} ${Math.round(h)}" preserveAspectRatio="xMidYMid meet"><defs>
  <marker id="pt" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse"><circle cx="5" cy="5" r="3.1"/></marker>
  <marker id="pton" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"><circle cx="5" cy="5" r="3.4"/></marker>
  <marker id="cv" viewBox="0 0 22 22" refX="11" refY="11" markerWidth="21" markerHeight="21" markerUnits="userSpaceOnUse" orient="auto"><circle class="cvb" cx="11" cy="11" r="8.6"/><path class="cvc" d="M9.2 7.6 L13 11 L9.2 14.4"/></marker>
  <marker id="cvon" viewBox="0 0 22 22" refX="11" refY="11" markerWidth="23" markerHeight="23" markerUnits="userSpaceOnUse" orient="auto"><circle class="cvb" cx="11" cy="11" r="9.2"/><path class="cvc" d="M9.2 7.5 L13.2 11 L9.2 14.5"/></marker>
 </defs>${zonas}${trazos}${nodos}</svg></div>`}
function panel(){const LST=lista(),cur=MAPA_F.find(f=>f.id===S.cur),i=LST.findIndex(f=>f.id===S.cur);
 const G0=MAPA_G.find(x=>x[0]===S.g)||['','Todo el Sistema','Los 48 intercambios de la ley y sus normas'];
 const ficha=cur?`<div class="card mp"><div class="mp-k">${MAPA_N[cur.de].t} → ${MAPA_N[cur.a].t}</div><div class="mp-t">${cur.t}</div><div class="mp-d">${cur.tip}</div><div class="mp-m">${cur.per} · ${cur.arts.map(chip).join('')}</div></div>`:'';
 return `${ficha}<div class="card mp"><div class="mp-k">${G0[1]}</div><div class="mp-t">${G0[2]}</div>
  <div class="ctl"><button class="btn" id="bPrev" ${i>0?'':'disabled'} aria-label="Anterior">${ic('chev')}</button><button class="btn p" id="bPlay">${ic(S.T?'pause':'play')}${S.T?'Detener':'Recorrer'}</button><button class="btn" id="bNext" ${i<LST.length-1?'':'disabled'} aria-label="Siguiente">${ic('chev')}</button></div>
  <ol class="steps">${LST.map((f,k)=>`<li class="${f.id===S.cur?'on':''}"><button data-s="${f.id}"><span class="sn">${k+1}</span><span class="tx"><b>${f.t}</b><span>${MAPA_N[f.de].t} → ${MAPA_N[f.a].t}</span></span></button></li>`).join('')}</ol></div>`}
function quien(){const k=S.ent;const fs=MAPA_F.filter(f=>f.de===k||f.a===k);
 const grupos=MAPA_G.map(([g,t])=>{const L=fs.filter(f=>f.g===g);if(!L.length)return '';
  return `<li class="g">${t}</li>${L.map(f=>{const sale=f.de===k;return `<li class="i"><span class="dir ${sale?'out':''}">${sale?'ENVÍA A '+MAPA_N[f.a].t.toUpperCase():'RECIBE DE '+MAPA_N[f.de].t.toUpperCase()}</span><b>${sale?f.d.charAt(0).toUpperCase()+f.d.slice(1):f.r}</b><span class="m">${f.per} · ${f.arts.map(chip).join('')}</span></li>`}).join('')}`}).join('');
 return `<div class="card mp"><div class="mp-k">Según la Ley 32123 y sus normas</div><div class="mp-t">${MAPA_N[k].t}</div><div class="mp-d">${MAPA_N[k].d}</div>
  <div class="chips" style="margin:12px 0 0">${Object.keys(MAPA_N).map(e=>`<button class="chip ${e===k?'on':''}" data-e="${e}">${MAPA_N[e].t}</button>`).join('')}</div>
  <ul class="duty">${grupos}</ul></div>`}
function normas(){const cuenta=k=>MAPA_F.reduce((a,f)=>a+f.arts.filter(x=>x.split(' ')[0]===k).length,0);
 return `<div class="card"><table class="nm"><thead><tr><th style="width:240px">Norma</th><th style="width:96px">Publicación</th><th style="width:90px">Emisor</th><th>Qué regula</th><th style="width:90px" class="n">Citas</th><th style="width:110px">Estado</th></tr></thead><tbody>
 ${NORMAS.map(n=>`<tr><td style="white-space:nowrap"><a href="${n[6]}" target="_blank" rel="noopener"><b style="font-weight:600">${n[1]}</b></a></td><td style="color:var(--ink-2)">${n[2]}</td><td style="color:var(--ink-2)">${n[3]}</td><td style="color:var(--ink-2)">${n[4]}</td><td class="n">${cuenta(n[0])||'—'}</td><td><span class="st">Vigente</span></td></tr>`).join('')}
 </tbody></table><div class="foot">Las citas son los artículos que sustentan cada intercambio del mapa · el texto de cada uno se abre desde su botón. Las resoluciones SBS de la carpeta no se usan en el mapa.</div></div>`}
function render(){
 $('#vista').innerHTML=[['mapa','Procesos'],['quien','Quién hace qué'],['normas','Normas']].map(([k,t])=>`<button class="${S.v===k?'on':''}" data-v="${k}">${t}</button>`).join('');
 let h='';
 if(S.v==='mapa'){const cnt=g=>MAPA_F.filter(f=>f.g===g).length;
  h=`<div class="chips">${[['','Todo el Sistema'],...MAPA_G].map(([k,t])=>`<button class="chip ${S.g===k?'on':''}" data-g="${k}">${t}<span class="n">${k?cnt(k):MAPA_F.length}</span></button>`).join('')}</div>
   <div class="grid"><div>${mapa()}</div><div class="side">${panel()}</div></div>`}
 else if(S.v==='quien')h=`<div class="grid"><div>${mapa()}</div><div class="side">${quien()}</div></div>`;
 else h=normas();
 $('#app').innerHTML=h;wire()}
function paso(d){const L=lista(),i=L.findIndex(f=>f.id===S.cur);const j=i+d;if(j>=0&&j<L.length){S.sel=L[j].id;render()}}
function play(){if(S.T){clearInterval(S.T);S.T=null;render();return}
 const L=lista();let i=L.findIndex(f=>f.id===S.cur);if(i<0||i>=L.length-1)i=-1;
 const tick=()=>{i++;if(i>=L.length){clearInterval(S.T);S.T=null;render();return}S.sel=L[i].id;render()};
 S.T=setInterval(tick,2800);tick()}
function wire(){
 $$('[data-v]').forEach(b=>b.onclick=()=>{if(S.T){clearInterval(S.T);S.T=null}S.v=b.dataset.v;try{localStorage.setItem('ley32123.v',S.v)}catch(e){}render()});
 $$('[data-g]').forEach(b=>b.onclick=()=>{if(S.T){clearInterval(S.T);S.T=null}S.g=b.dataset.g;S.sel='';render()});
 $$('[data-s]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.s;render()});
 $$('[data-e]').forEach(b=>b.onclick=()=>{S.ent=b.dataset.e;render()});
 const bp=$('#bPrev'),bn=$('#bNext'),bl=$('#bPlay');if(bp)bp.onclick=()=>paso(-1);if(bn)bn.onclick=()=>paso(1);if(bl)bl.onclick=play;
 $$('[data-art]').forEach(b=>{const a=ART[b.dataset.art];
  b.onmouseenter=()=>tipShow(`<div class="t">${a[0]}</div>${a[1].replace(/<br>/g,' ').slice(0,360)}${a[1].length>360?'…':''}<div class="h">Clic para leer el texto completo</div>`,b.getBoundingClientRect());
  b.onmouseleave=tipHide;b.onclick=e=>{e.stopPropagation();tipHide();verArt(b.dataset.art)}});
 $$('.mf').forEach(gr=>{const ids=gr.dataset.ids.split(','),f=MAPA_F.find(x=>x.id===gr.dataset.f);
  gr.onclick=()=>{if(S.v==='quien'){S.v='mapa';S.g=f.g}else if(!S.g)S.g='';S.sel=f.id;render()};
  let html='';
  if(ids.length>1)html=`<div class="t">${ids.length} intercambios por este tramo</div>${ids.map(i=>MAPA_F.find(x=>x.id===i).t).join(' · ')}`;
  else if(f.id!==S.cur)html=`<div class="t">${f.t}</div>${f.tip}`;
  gr.onmousemove=e=>html?tipShow(html,at(e)):tipHide();gr.onmouseleave=tipHide});
 $$('.mn').forEach(gr=>{const k=gr.dataset.n,N=MAPA_N[k];
  gr.onclick=()=>{S.ent=k;if(S.v!=='quien'){S.v='quien'}render()};
  const cur=MAPA_F.find(x=>x.id===S.cur);
  const fr=S.v==='mapa'&&cur&&(cur.de===k||cur.a===k)?(cur.de===k?cur.d.charAt(0).toUpperCase()+cur.d.slice(1):cur.r):N.d;
  gr.onmousemove=e=>tipShow(fr,at(e));gr.onmouseleave=tipHide});
 $$('.mz').forEach(gr=>{const z=MAPA_Z.find(x=>x.t===gr.dataset.z);gr.onmousemove=e=>tipShow(`<div class="t">${z.t}</div>${z.d}`,at(e));gr.onmouseleave=tipHide});
}
render();
</script>
</body>
</html>
